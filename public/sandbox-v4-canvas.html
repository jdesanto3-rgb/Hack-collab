<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weave — Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;font-size:14px;color:var(--text);background:var(--bg-canvas)}
button{font-family:'Hanken Grotesk',sans-serif;border:none;cursor:pointer}
a{text-decoration:none;color:inherit}
@keyframes ch-rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes ch-pop{0%{transform:translateY(10px) scale(.975);opacity:0}60%{transform:translateY(-2px) scale(1.006)}100%{transform:none;opacity:1}}
@keyframes ch-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2,#cfcabd);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;flex:none;z-index:10}
#subheader{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:10px;flex:none}
#body{flex:1;overflow:hidden}
.board{height:100%;overflow-x:auto;overflow-y:hidden;padding:20px 24px 28px;display:flex;gap:16px;align-items:flex-start}
.col{flex:none;width:292px;display:flex;flex-direction:column}
.col-head{padding:0 2px 10px;display:flex;align-items:center;gap:8px}
.col-body{display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:calc(100vh - 160px);padding:2px;padding-bottom:32px}
.proj{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow-sm);animation:ch-rise .4s ease;transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:0}
.proj:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.proj-accent{height:3px;border-radius:13px 13px 0 0;margin:-16px -16px 14px;flex:none}
.proj-client{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.5px;padding:3px 7px;border-radius:4px;margin-bottom:8px}
.proj-name{font-family:'Space Grotesk',sans-serif;font-size:17px;line-height:1.25;margin-bottom:6px}
.proj-brief{font-size:12px;color:var(--text2);line-height:1.45;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog-bar{height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-bottom:12px}
.prog-fill{height:100%;border-radius:2px}
.proj-agents{display:flex;align-items:center;gap:-4px;margin-bottom:12px}
.agent-dot{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:700;color:#fff;flex:none;border:2px solid var(--surface);margin-right:-5px}
.proj-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.open-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);transition:all .12s;cursor:pointer}
.open-btn:hover{background:var(--brand);color:var(--bg-canvas);border-color:var(--brand)}
.pill{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.pill.on{background:var(--brand);color:var(--bg-canvas);border-color:var(--brand)}
.new-btn{padding:8px 16px;border-radius:9px;background:var(--brand);color:var(--bg-canvas);font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;margin-left:auto;transition:opacity .15s}
.new-btn:hover{opacity:.85}
.add-col{flex:none;width:260px;border:2px dashed var(--border2);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:80px;color:var(--text3);font-size:13px;gap:7px;transition:all .15s;padding:20px}
.add-col:hover{border-color:var(--brand);color:var(--brand)}
.live-dot{width:6px;height:6px;border-radius:50%;background:#2e8157;animation:ch-pulse 2s ease-in-out infinite;flex:none}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="subheader" id="sub"></div>
  <div id="body"><div class="board" id="board"></div></div>
</div>

<script>
// ── TOKENS ────────────────────────────────────────────────────────────────────
function readTokens(){
  const s=getComputedStyle(document.documentElement),g=v=>s.getPropertyValue(v).trim();
  return{
    bgCanvas:g('--bg-canvas')||'#ecebe5',surface:g('--surface')||'#FDFAF6',
    surfaceWarm:g('--surface-warm')||'#fffdf8',surface2:g('--surface2')||'#E8E3D9',
    border:g('--border')||'#D8D2C6',border2:g('--border2')||'#C4BCAF',
    text:g('--text')||'#1C1914',text2:g('--text2')||'#6B6860',text3:g('--text3')||'#9C9890',
    brand:g('--brand')||'#1E1C18',brandLight:g('--brand-light')||'#EDEAE4',
    blue:g('--blue')||'#2f5bea',blueLight:g('--blue-light')||'#e7eefe',
    green:g('--green')||'#2e8157',greenLight:g('--green-light')||'#e6f3ec',
    purple:g('--purple')||'#6f57d4',purpleLight:g('--purple-light')||'#efebfb',
    teal:g('--teal')||'#1f9d8f',amber:g('--amber')||'#c2700f',
    amberLight:g('--amber-light')||'#faeeda',red:g('--red')||'#d4456b',
    shadowSm:g('--shadow-sm')||'0 1px 2px rgba(28,25,20,.06)',
    shadowMd:g('--shadow-md')||'0 2px 8px rgba(28,25,20,.08)',
  };
}
let T=readTokens();
function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark')return true;if(a==='light')return false;return window.matchMedia('(prefers-color-scheme:dark)').matches;}
function toggleTheme(){document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');T=readTokens();render();}

// ── DATA ──────────────────────────────────────────────────────────────────────
const AGENTS=[
  {key:'RE',color:'#1f9d8f',name:'Research Agent'},
  {key:'ST',color:'#c2700f',name:'Strategy Agent'},
  {key:'WF',color:'#6f57d4',name:'Wireframe Agent'},
  {key:'VD',color:'#d4456b',name:'Visual Design Agent'},
  {key:'PR',color:'#2e8157',name:'Persona Review Agent'},
  {key:'EC',color:'#2f5bea',name:'ECD Agent'},
];
const AGENT_MAP=Object.fromEntries(AGENTS.map(a=>[a.key,a]));

const PROJECTS=[
  {
    id:'axiom-intake',
    name:'Axiom — Test Request Intake',
    client:'Axiom QA',
    clientColor:'#2f5bea',
    accent:'#2f5bea',
    phase:'review',
    phaseLabel:'In Review',
    brief:'Redesign the QA test request intake to cut a 55% abandon rate and reduce triage time from 3.4 days to under 4 hours.',
    progress:68,
    agents:['RE','ST','WF','VD','PR'],
    updated:'2m ago',
    tag:'Persona review active',
    tagColor:'#d4456b',
  },
  {
    id:'chorus-onboarding',
    name:'Weave — Onboarding Flow',
    client:'Internal',
    clientColor:'#1f9d8f',
    accent:'#1f9d8f',
    phase:'concepting',
    phaseLabel:'Concepting',
    brief:'First-run experience for new workspace members — zero friction from invite to first project brief.',
    progress:38,
    agents:['RE','ST','WF'],
    updated:'1h ago',
    tag:'3 directions in parallel',
    tagColor:'#6f57d4',
  },
  {
    id:'axiom-dashboard',
    name:'Axiom — Analytics Dashboard',
    client:'Axiom QA',
    clientColor:'#2f5bea',
    accent:'#c2700f',
    phase:'concepting',
    phaseLabel:'Concepting',
    brief:'Executive metrics view for QA leadership — test velocity, coverage gaps, SLA drift — at a glance.',
    progress:29,
    agents:['RE','ST'],
    updated:'3h ago',
    tag:'Design Brief ready',
    tagColor:'#c2700f',
  },
  {
    id:'axiom-migration',
    name:'Jira → Axiom Migration UX',
    client:'Enterprise',
    clientColor:'#6f57d4',
    accent:'#2e8157',
    phase:'approved',
    phaseLabel:'Approved',
    brief:'Guided migration wizard for teams moving from Jira Service Mgmt to Axiom. Import, map, and validate in three steps.',
    progress:91,
    agents:['RE','ST','WF','VD','PR','EC'],
    updated:'Yesterday',
    tag:'ECD Approved',
    tagColor:'#2e8157',
  },
  {
    id:'chorus-designsystem',
    name:'Weave Design System v2',
    client:'Internal',
    clientColor:'#1f9d8f',
    accent:'#6f57d4',
    phase:'briefing',
    phaseLabel:'Briefing',
    brief:'Evolve the Chorus token set — dark mode parity, responsive spacing scale, new component set for collaboration surfaces.',
    progress:9,
    agents:['RE'],
    updated:'Just now',
    tag:'Brief landed',
    tagColor:'#9C9890',
  },
  {
    id:'axiom-mobile',
    name:'Axiom — Mobile App v1',
    client:'Axiom QA',
    clientColor:'#2f5bea',
    accent:'#d4456b',
    phase:'live',
    phaseLabel:'Live',
    brief:'Native mobile companion for test request submission and triage notifications. iOS & Android parity.',
    progress:100,
    agents:['RE','ST','WF','VD','PR','EC'],
    updated:'3d ago',
    tag:'Promoted · Live',
    tagColor:'#2e8157',
  },
];

const COLS=[
  {key:'briefing',  label:'Briefing',  color:'#9C9890', dot:'#9C9890'},
  {key:'concepting',label:'Concepting',color:'#6f57d4', dot:'#6f57d4'},
  {key:'review',    label:'In Review', color:'#c2700f', dot:'#c2700f'},
  {key:'approved',  label:'Approved',  color:'#2e8157', dot:'#2e8157'},
  {key:'live',      label:'Live',      color:'#2f5bea', dot:'#2f5bea'},
];

const state={filter:'all'};
const IDENTITY=['Weave','Quorum','Atelier'];
let identityIdx=0;

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderHeader(){
  const name=IDENTITY[identityIdx];
  document.getElementById('hdr').innerHTML=`
    <div style="display:flex;align-items:center;gap:9px;cursor:pointer" onclick="identityIdx=(identityIdx+1)%3;renderHeader()">
      <div style="width:28px;height:28px;border-radius:8px;background:${T.text};display:flex;align-items:center;justify-content:center;flex:none">
        <div style="display:flex;align-items:flex-end;gap:2px;height:14px">
          <span style="width:2.5px;height:6px;background:#ffd166;border-radius:2px"></span>
          <span style="width:2.5px;height:14px;background:${T.bgCanvas};border-radius:2px"></span>
          <span style="width:2.5px;height:9px;background:#7aa2ff;border-radius:2px"></span>
        </div>
      </div>
      <span style="font-family:'Space Grotesk',sans-serif;font-size:22px;letter-spacing:.3px">${name}</span>
      <span style="font-size:9px;font-family:'JetBrains Mono',monospace;color:${T.text3};border:1px solid ${T.border};border-radius:4px;padding:2px 5px;letter-spacing:.5px">BETA</span>
    </div>
    <div style="width:1px;height:22px;background:${T.border};flex:none"></div>
    <span style="font-size:12.5px;color:${T.text2}">Team Canvas</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <button onclick="toggleTheme()" style="width:32px;height:32px;border-radius:8px;background:${T.surface2};border:1px solid ${T.border};display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:${T.text2};transition:all .15s" onmouseover="this.style.background='${T.border}'" onmouseout="this.style.background='${T.surface2}'">${isDark()?'☀︎':'◑'}</button>
      <div style="display:flex">
        <div style="width:30px;height:30px;border-radius:50%;background:#d4456b;border:2px solid ${T.surface};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;z-index:3;margin-right:-8px" title="Devon Park">DP</div>
        <div style="width:30px;height:30px;border-radius:50%;background:#2e8157;border:2px solid ${T.surface};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;z-index:2;margin-right:-8px" title="Jordan Lee">JL</div>
        <div style="width:30px;height:30px;border-radius:50%;background:${T.border2};border:2px solid ${T.surface};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${T.text2};z-index:1">+3</div>
      </div>
    </div>
  `;
}

function renderSubheader(){
  const sub=document.getElementById('subheader');
  const filters=[
    {k:'all',l:'All projects'},
    {k:'mine',l:'Assigned to me'},
    {k:'Axiom QA',l:'Axiom QA'},
    {k:'Internal',l:'Internal'},
    {k:'Enterprise',l:'Enterprise'},
  ];
  sub.innerHTML=`
    ${filters.map(f=>`
      <button class="pill${state.filter===f.k?' on':''}" onclick="state.filter='${f.k}';renderBoard()">${f.l}</button>
    `).join('')}
    <button class="new-btn" onclick="alert('New Project wizard — coming in the next sprint!')">
      <span style="font-size:16px;line-height:1">+</span> New Project
    </button>
  `;
}

function renderBoard(){
  const el=document.getElementById('board');
  const projects=PROJECTS.filter(p=>{
    if(state.filter==='all'||state.filter==='mine') return true;
    return p.client===state.filter;
  });
  el.innerHTML=COLS.map(col=>{
    const cards=projects.filter(p=>p.phase===col.key);
    return `
      <div class="col">
        <div class="col-head">
          <span style="width:8px;height:8px;border-radius:50%;background:${col.color};flex:none"></span>
          <span style="font-size:13.5px;font-weight:600;flex:1">${col.label}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${T.text3}">${cards.length}</span>
        </div>
        <div style="height:2px;background:${col.color};border-radius:2px;margin-bottom:12px;opacity:.35"></div>
        <div class="col-body">
          ${cards.length===0
            ?`<div style="padding:28px 16px;text-align:center;font-size:12px;color:${T.text3};font-style:italic;border:1.5px dashed ${T.border};border-radius:12px">No projects here</div>`
            :cards.map(p=>renderCard(p)).join('')
          }
        </div>
      </div>
    `;
  }).join('')+`
    <div class="add-col" onclick="alert('Add custom column — coming soon')">
      <span style="font-size:22px;line-height:1;color:${T.border2}">+</span>
      <span>Add column</span>
    </div>
  `;
}

function renderCard(p){
  const agentDots=p.agents.map(k=>{
    const a=AGENT_MAP[k];
    return `<div class="agent-dot" style="background:${a.color}" title="${a.name}">${k}</div>`;
  }).join('');
  const progColor=p.progress>=90?T.green:p.progress>=50?T.blue:T.amber;
  return `
    <a class="proj" href="sandbox-v4-project.html?project=${p.id}" style="display:flex;flex-direction:column">
      <div class="proj-accent" style="background:${p.accent}"></div>
      <div class="proj-client" style="background:${p.clientColor}18;color:${p.clientColor}">
        <span style="width:5px;height:5px;border-radius:50%;background:${p.clientColor};flex:none"></span>
        ${p.client}
      </div>
      <div class="proj-name">${p.name}</div>
      <div class="proj-brief">${p.brief}</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${p.progress}%;background:${progColor}"></div></div>
      <div class="proj-agents" style="margin-bottom:10px">
        ${agentDots}
        <span style="margin-left:10px;font-size:11px;color:${T.text3}">${p.agents.length} agent${p.agents.length!==1?'s':''}</span>
      </div>
      <div class="proj-footer">
        <div style="display:flex;flex-direction:column;gap:3px">
          <span style="font-size:10.5px;font-weight:700;color:${p.tagColor}">${p.tag}</span>
          <span style="font-size:10px;color:${T.text3}">Updated ${p.updated}</span>
        </div>
        <button class="open-btn" onclick="event.preventDefault();window.location.href='sandbox-v4-project.html?project=${p.id}'">Open →</button>
      </div>
    </a>
  `;
}

function render(){renderHeader();renderSubheader();renderBoard();}
render();
</script>
</body>
</html>

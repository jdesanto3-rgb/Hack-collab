<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weave — Neura Nova · Design Team</title>
<link rel="icon" href="/weave_colored_glow_logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg-canvas)}
button{font-family:'Inter',sans-serif;border:none;cursor:pointer}
a{text-decoration:none;color:inherit}
@keyframes ch-rise{from{transform:translateY(9px);opacity:0}to{transform:none;opacity:1}}
@keyframes ch-pop{0%{transform:translateY(12px) scale(.975);opacity:0}60%{transform:translateY(-2px) scale(1.008)}100%{transform:none;opacity:1}}
@keyframes ch-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes ch-flow{from{background-position:0 0}to{background-position:24px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2,#cfcabd);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:64px;background:var(--surface);display:flex;align-items:center;padding:0 24px;gap:13px;flex:none;z-index:10}
#body{flex:1;min-height:0;display:flex;overflow:hidden}

.pipeline-rail{width:264px;flex:none;background:var(--surface2);padding:22px 18px;display:flex;flex-direction:column;overflow-y:auto}
.stage{flex:1;padding:28px 36px;overflow-y:auto;display:flex;flex-direction:column}
.feed-rail{width:300px;flex:none;background:var(--surface2);padding:20px 16px;display:flex;flex-direction:column;overflow-y:auto}

.canvas-card{background:var(--surface);border-radius:11px;padding:12px;cursor:pointer;animation:ch-rise .4s ease;transition:box-shadow .15s,transform .15s;box-shadow:var(--shadow-sm);position:relative}
.canvas-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.canvas-card::before{content:'';position:absolute;inset:-2px;border-radius:inherit;background:conic-gradient(from var(--glow-angle),transparent 0%,transparent 60%,color-mix(in srgb,var(--card-accent,var(--brand)) 65%,transparent) 76%,var(--card-accent,var(--brand)) 85%,var(--brand-mid) 91%,var(--card-accent,var(--brand)) 97%,transparent 100%);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;padding:2px;animation:glow-rotate 2.5s linear infinite;pointer-events:none;opacity:0;transition:opacity .25s ease}
.canvas-card:hover::before{opacity:1}
.dir-card{background:var(--surface-warm);border-radius:13px;padding:15px;cursor:pointer;transition:opacity .2s;flex:1;min-width:210px;border:2px solid transparent}
.dir-card:hover{box-shadow:0 3px 12px rgba(20,18,12,.09)}
.event-card{background:var(--surface);border-radius:11px;padding:12px;animation:ch-rise .35s ease;margin-bottom:9px}
.tag-chip{display:inline-flex;align-items:center;border-radius:5px;padding:3px 7px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;margin-top:7px}
.prov-step{display:flex;align-items:flex-start;gap:9px;padding:8px 0}
.dir-panel{margin-bottom:10px;border-radius:9px;overflow:hidden;background:var(--surface)}
.dir-panel-header{padding:9px 11px;font-size:11px;font-weight:600;color:var(--text2);background:var(--surface2);display:flex;align-items:center;gap:6px}
.dir-textarea{width:100%;padding:9px 11px;border:none;background:var(--surface);color:var(--text);font-family:'Inter',sans-serif;font-size:12.5px;line-height:1.5;resize:vertical;min-height:62px;outline:none;display:block}
.dir-footer{padding:7px 10px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.dir-hint{font-size:10px;color:var(--text3)}
.ref-row{display:flex;gap:10px;margin-top:20px;overflow-x:auto}
.ref-card{flex:none;width:148px;background:var(--surface);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.ref-thumb{height:76px;overflow:hidden}
.ref-meta{padding:7px 9px}
.ref-source{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.5px}
.ref-label{font-size:11.5px;font-weight:600;margin-top:2px;line-height:1.3}
[contenteditable="true"]{outline:1.5px dashed var(--border2);border-radius:4px;padding:2px 4px;transition:outline .15s}
[contenteditable="true"]:focus{outline:2px solid var(--brand);background:var(--surface-warm)}
.edit-btn{font-size:11px;padding:4px 10px;border-radius:6px;background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.edit-btn:hover{background:var(--surface2);color:var(--text)}
.edit-btn.saving{background:var(--green);color:#fff}
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <div id="body"></div>
</div>
<div id="drawer-root"></div>
<div id="proto-root"></div>

<script>
// ── TOKENS ────────────────────────────────────────────────────────────────────
function readTokens(){
  const s=getComputedStyle(document.documentElement),g=v=>s.getPropertyValue(v).trim();
  return{
    bgCanvas:g('--bg-canvas')||'#ecebe5',surface:g('--surface')||'#FDFAF6',
    surfaceWarm:g('--surface-warm')||'#fffdf8',surface2:g('--surface2')||'#E8E3D9',
    border:g('--border')||'#D8D2C6',border2:g('--border2')||'#C4BCAF',
    text:g('--text')||'#1C1914',text2:g('--text2')||'#6B6860',text3:g('--text3')||'#9C9890',
    brand:g('--brand')||'#1E1C18',brandLight:g('--brand-light')||'#EDEAE4',
    brandMid:g('--brand-mid')||'#9B8E83',
    blue:g('--blue')||'#2f5bea',blueLight:g('--blue-light')||'#e7eefe',
    green:g('--green')||'#2e8157',greenLight:g('--green-light')||'#e6f3ec',
    purple:g('--purple')||'#6f57d4',purpleLight:g('--purple-light')||'#efebfb',
    teal:g('--teal')||'#1f9d8f',amber:g('--amber')||'#c2700f',
    amberLight:g('--amber-light')||'#faeeda',red:g('--red')||'#d4456b',
    stone:g('--stone')||'#7A6A5C',stoneLight:g('--stone-light')||'#F2EDE7',
    shadowSm:g('--shadow-sm')||'0 1px 2px rgba(28,25,20,.06)',
    shadowMd:g('--shadow-md')||'0 2px 8px rgba(28,25,20,.08)',
    shadowLg:g('--shadow-lg')||'0 4px 16px rgba(28,25,20,.10)',
  };
}
let T=readTokens();
function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark')return true;if(a==='light')return false;return window.matchMedia('(prefers-color-scheme:dark)').matches;}
function toggleTheme(){document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');T=readTokens();render();}

// ── DATA ──────────────────────────────────────────────────────────────────────
const AGENTS=[
  {key:'research', name:'Research Agent',      short:'RE',color:'#1f9d8f'},
  {key:'strategy', name:'Strategy Agent',       short:'ST',color:'#c2700f'},
  {key:'wireframe',name:'Wireframe Agent',      short:'WF',color:'#6f57d4'},
  {key:'visual',   name:'Visual Design Agent',  short:'VD',color:'#d4456b'},
  {key:'persona',  name:'Persona Review Agent', short:'PR',color:'#2e8157'},
  {key:'ecd',      name:'ECD Agent',            short:'EC',color:'#2f5bea'},
];
const AGENT_MAP=Object.fromEntries(AGENTS.map(a=>[a.key,a]));

const PHASES=[
  {agent:null,       kind:'idle',    eyebrow:'INTAKE',                     title:'A new brief just landed',               sub:'The Research Agent picks it up and synthesizes context from five project sources.'},
  {agent:'research', kind:'research',eyebrow:'RESEARCH AGENT',             title:'Research Brief',                        sub:'Five inputs synthesized into the signal that matters for Neura Nova\'s landing page.'},
  {agent:'strategy', kind:'strategy',eyebrow:'STRATEGY AGENT',             title:'Design Brief',                          sub:'Goals, persona, and constraints — with the Neura Nova brand system wired in.'},
  {agent:'wireframe',kind:'concepts',eyebrow:'WIREFRAME AGENT · PARALLEL', title:'Three directions, generated at once',   sub:'The Wireframe Agent ran three explorations in parallel. A human picks the direction.'},
  {agent:'visual',   kind:'visual',  eyebrow:'VISUAL DESIGN AGENT',        title:'Hi-fi concept',                         sub:'The Visual Design Agent applied the Neura Nova brand system to the chosen direction.'},
  {agent:'persona',  kind:'persona', eyebrow:'PERSONA REVIEW AGENT',       title:'Hi-fi concept — in review',             sub:'Compare design versions, respond to persona feedback from Maya Chen, and create revisions.'},
  {agent:'ecd',      kind:'ecd',     eyebrow:'ECD AGENT · GATE',           title:'Executive Creative Director gate',      sub:'The ECD reviews feedback and concept, then a human confirms the promotion.'},
  {agent:'ecd',      kind:'promoted',eyebrow:'PROMOTED',                   title:'Promoted to the Shared Canvas',         sub:'Traceable from brief to approved — now visible to the whole team.'},
];

const DIRECTIONS=[
  {id:'A',name:'Hero-first scroll',   desc:'Full-bleed hero with animated neural network visual, single CTA above the fold.',                   tone:'#6f57d4'},
  {id:'B',name:'Feature grid reveal', desc:'Immediate value props in a responsive grid — product screenshots drive the narrative.',              tone:'#2f5bea'},
  {id:'C',name:'Conversational demo', desc:'Interactive "try it now" prompt in the hero — users experience the product before signing up.',     tone:'#1f9d8f'},
];

const PHASE_BTN_LABELS=[
  'Start the flow',
  'Continue',
  'Continue',
  'Select a direction to continue',
  'Run persona review',
  'Send to ECD review',
  'Approve & promote to canvas',
  'Flow complete',
];

const PHASE_EVENTS={
  1:[{a:'research', t:'Synthesized 5 inputs into a Research Brief for Neura Nova landing page',tag:''}],
  2:[
    {a:'strategy',t:'Converted brief → Design Brief (goals · persona · brand system)',tag:''},
    {a:'ecd',     t:'Flagged Design Brief ready for concepting',tag:'gate'},
  ],
  3:[{a:'wireframe',t:'Spawned 3 directions in parallel · all Exploring',tag:'parallel'}],
  4:[{a:'visual',   t:'Applied Neura Nova brand system to selected direction',tag:''}],
  5:[{a:'persona',  t:'Returned structured feedback vs. persona "Maya Chen"',tag:''}],
  6:[{a:'ecd',      t:'Reviewed persona feedback — concept meets the bar',tag:''}],
  7:[{a:'ecd',      t:'Approved & promoted to Shared Canvas',tag:'promote'}],
};

const PROV_BY_KIND={
  wire:[
    {a:'strategy', t:'Design Brief handed off',tag:''},
    {a:'wireframe',t:'Generated as one of 3 parallel directions',tag:'parallel'},
  ],
  hifi:[
    {a:'wireframe',t:'Wireframe direction selected by human',tag:'human'},
    {a:'visual',   t:'Neura Nova brand system applied',tag:''},
    {a:'persona',  t:'Persona review returned',tag:''},
    {a:'ecd',      t:'ECD approved · promoted',tag:'promote'},
  ],
  brief:[
    {a:'research',t:'Synthesized 5 project inputs',tag:''},
    {a:'ecd',     t:'Promoted to shared canvas',tag:'promote'},
  ],
};

const BASE_CANVAS={
  exploring:[
    {id:'ex-a',kind:'wire',kindLabel:'WIREFRAME',title:'Direction A — Hero-first scroll',   agent:'Wireframe Agent',agentShort:'WF',agentColor:'#6f57d4',time:'5m'},
    {id:'ex-b',kind:'wire',kindLabel:'WIREFRAME',title:'Direction B — Feature grid reveal', agent:'Wireframe Agent',agentShort:'WF',agentColor:'#6f57d4',time:'5m'},
    {id:'ex-c',kind:'wire',kindLabel:'WIREFRAME',title:'Direction C — Conversational demo', agent:'Wireframe Agent',agentShort:'WF',agentColor:'#6f57d4',time:'5m'},
  ],
  review:[
    {id:'rv-b',kind:'hifi',kindLabel:'HI-FI CONCEPT',title:'Direction B — Neura Nova brand applied',agent:'Visual Design Agent',agentShort:'VD',agentColor:'#d4456b',time:'2m',tone:'#2f5bea'},
  ],
  approved:[
    {id:'ap-1',kind:'hifi',kindLabel:'HI-FI CONCEPT',title:'Landing page — hero section',agent:'ECD Agent',agentShort:'EC',agentColor:'#2f5bea',time:'just now',tone:'#2e8157'},
  ],
  promoted:[
    {id:'pr-1',kind:'hifi', kindLabel:'PROMOTED',      title:'Neura Nova landing page — v1',       agent:'ECD Agent',     agentShort:'EC',agentColor:'#2f5bea',time:'2h', tone:'#6f57d4'},
    {id:'pr-2',kind:'brief',kindLabel:'RESEARCH BRIEF',title:'Neura Nova — context synthesis',     agent:'Research Agent',agentShort:'RE',agentColor:'#1f9d8f',time:'3h'},
  ],
};

const CARD_PHASE_MAP={
  'ex-a':{phase:3,selectedDir:null},
  'ex-b':{phase:3,selectedDir:null},
  'ex-c':{phase:3,selectedDir:null},
  'rv-b':{phase:5,selectedDir:'B'},
  'ap-1':{phase:6,selectedDir:'B'},
  'pr-1':{phase:7,selectedDir:'B'},
  'pr-2':{phase:1,selectedDir:null},
};

const state={
  phase:0,selectedDir:null,events:[],detail:null,
  editModes:{},dirPanels:{},
  pipelineOpen:true,feedOpen:true,feedTab:'activity',
  chatMessages:[],chatTyping:false,
  designVersion:2,v3Created:false,creatingVersion:false,
  designNotes:{},protoOpen:false,protoCard:null,protoScreen:0,
};

const CHAT_REPLIES=[
  "The research brief is clear: bounce rate peaks at the fold because visitors don't immediately understand what Neura Nova does. Whatever direction you choose, the hero headline needs to be a value prop, not a tagline.",
  "Maya Chen's persona signals technical credibility over polish. Any element that doesn't answer 'what makes this better' in 8 words should be below the fold.",
  "Looking at the references — Vercel's landing page is your strongest benchmark. Clean, benchmark-forward, single CTA per viewport.",
  "The Neura Nova purple token is strong enough to anchor the hero. Don't dilute it with secondary brand colors above the fold.",
  "Three directions are in play. My read: Direction C (conversational demo) has the highest chance of converting Maya — she wants to experience the product, not read about it.",
  "The hero headline conflict flagged in persona review is worth resolving next — 'Intelligent infrastructure' reads as a tagline; Maya wants '10× faster model serving at half the cost'.",
];

// ── STATE HELPERS ─────────────────────────────────────────────────────────────
function setState(updates){Object.assign(state,updates);render();}
function advance(){
  if(state.phase===3&&!state.selectedDir)return;
  if(state.phase>=7)return;
  const next=state.phase+1;
  const newEvents=(PHASE_EVENTS[next]||[]).map(e=>({...e}));
  setState({phase:next,events:[...newEvents,...state.events]});
}
function resetFlow(){setState({phase:0,selectedDir:null,events:[],editModes:{},dirPanels:{},chatMessages:[],chatTyping:false,designVersion:2,v3Created:false,creatingVersion:false,designNotes:{},protoOpen:false,protoCard:null,protoScreen:0});}
function selectDir(id){if(state.phase===3)setState({selectedDir:id});}
function openDetail(cardId){setState({detail:cardId});}
function closeDetail(){setState({detail:null});}
function openPrototype(cardId){setState({protoOpen:true,protoCard:cardId||null,protoScreen:0});}
function closePrototype(){setState({protoOpen:false});}
function protoNext(){if(state.protoScreen<2)setState({protoScreen:state.protoScreen+1});}
function protoPrev(){if(state.protoScreen>0)setState({protoScreen:state.protoScreen-1});}
function togglePipeline(){setState({pipelineOpen:!state.pipelineOpen});}
function toggleFeed(){setState({feedOpen:!state.feedOpen});}
function switchFeedTab(tab){setState({feedTab:tab});}
function selectDesignVersion(v){setState({designVersion:v});}
function createDesignV3(){
  if(state.v3Created){setState({designVersion:3});return;}
  if(state.creatingVersion)return;
  setState({creatingVersion:true});
  setTimeout(()=>{
    const newEvent={a:'visual',t:'v3 created — Hero headline rewritten as value prop, Enterprise nav link removed',tag:''};
    setState({v3Created:true,designVersion:3,creatingVersion:false,events:[newEvent,...state.events]});
  },1800);
}
function toggleEdit(cardId){
  const newModes=Object.assign({},state.editModes);
  newModes[cardId]=!newModes[cardId];
  state.editModes=newModes;
  const card=document.getElementById(cardId);
  if(!card)return;
  const isEdit=newModes[cardId];
  card.querySelectorAll('[data-ed]').forEach(el=>{el.contentEditable=isEdit?'true':'false';});
  const btn=document.getElementById('edit-btn-'+cardId);
  if(btn){btn.textContent=isEdit?'Save ✓':'✎ Edit';btn.className='edit-btn'+(isEdit?' saving':'');}
}
function getChatReply(text){
  const idx=(text.length*3+state.phase*7+state.chatMessages.length)%CHAT_REPLIES.length;
  return CHAT_REPLIES[idx];
}
function sendChat(){
  const input=document.getElementById('chat-input');
  if(!input)return;
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  const msgs=[...state.chatMessages,{role:'user',text}];
  const activeAgentKey=state.phase>0&&state.phase<8?PHASES[state.phase].agent:null;
  const newEvents=activeAgentKey?[{a:activeAgentKey,t:text,tag:'directed'},...state.events]:state.events;
  setState({chatMessages:msgs,chatTyping:true,events:newEvents});
  setTimeout(()=>{const el=document.getElementById('chat-messages');if(el)el.scrollTop=el.scrollHeight;},30);
  setTimeout(()=>{
    setState({chatMessages:[...state.chatMessages,{role:'ai',text:getChatReply(text)}],chatTyping:false});
    setTimeout(()=>{const el=document.getElementById('chat-messages');if(el)el.scrollTop=el.scrollHeight;},30);
  },1400);
}
function eventsUpToPhase(targetPhase){
  const events=[];
  for(let i=targetPhase;i>=1;i--)(PHASE_EVENTS[i]||[]).forEach(e=>events.push({...e}));
  return events;
}
function getProtoContext(){
  if(state.protoCard){
    const card=findCard(state.protoCard);
    const fidelity=(card&&card.kind==='wire')?'wire':'hifi';
    const tone=(card&&card.tone)?card.tone:'#6f57d4';
    return{fidelity,tone,version:null};
  }
  const dir=DIRECTIONS.find(d=>d.id===state.selectedDir)||DIRECTIONS[0];
  return{fidelity:state.phase>=4?'hifi':'wire',tone:dir.tone,version:state.designVersion};
}

// ── THUMBNAILS ────────────────────────────────────────────────────────────────
function wireThumbnail(h){
  h=h||96;
  return `<div style="height:${h}px;border-radius:7px;background:${T.surfaceWarm};border:1px solid ${T.border};padding:9px;display:flex;flex-direction:column;gap:6px;overflow:hidden">
    <div style="display:flex;gap:5px;align-items:center">
      <div style="width:12px;height:12px;border:1.5px solid ${T.border2};border-radius:3px;flex:none"></div>
      <div style="height:6px;width:38%;background:${T.border2};border-radius:2px"></div>
      <div style="height:9px;width:20px;border:1.5px solid ${T.border2};border-radius:3px;margin-left:auto"></div>
    </div>
    <div style="height:4px;width:90%;background:${T.border};border-radius:2px"></div>
    <div style="height:18px;border:1.5px solid ${T.border};border-radius:4px;background:${T.surface};display:flex;align-items:center;padding:0 6px">
      <div style="height:4px;width:55%;background:${T.border};border-radius:2px"></div>
    </div>
    <div style="height:18px;border:1.5px solid ${T.border};border-radius:4px;background:${T.surface};display:flex;align-items:center;padding:0 6px">
      <div style="height:4px;width:40%;background:${T.border};border-radius:2px"></div>
    </div>
    <div style="flex:1;display:flex;gap:5px;align-items:flex-end">
      <div style="flex:1;height:10px;border:1.5px solid ${T.border2};border-radius:4px;background:${T.surface2}"></div>
      <div style="height:10px;width:32px;background:${T.border2};border-radius:4px"></div>
    </div>
  </div>`;
}
function hifiThumbnail(tone,h){
  h=h||96;
  return `<div style="height:${h}px;border-radius:7px;background:${T.surface};border:1px solid ${T.border};overflow:hidden;display:flex;flex-direction:column">
    <div style="height:28px;background:${tone};display:flex;align-items:center;padding:0 9px;gap:6px;flex:none">
      <div style="width:24%;height:6px;background:rgba(255,255,255,.9);border-radius:3px"></div>
      <div style="display:flex;gap:3px;margin-left:auto">
        <div style="width:12px;height:8px;background:rgba(255,255,255,.5);border-radius:2px"></div>
        <div style="width:12px;height:8px;background:rgba(255,255,255,.5);border-radius:2px"></div>
      </div>
    </div>
    <div style="flex:1;padding:9px 10px;display:flex;flex-direction:column;gap:5px">
      <div style="height:5px;width:70%;background:${T.text};border-radius:3px"></div>
      <div style="height:4px;width:90%;background:${T.surface2};border-radius:3px"></div>
      <div style="height:13px;background:${T.surface2};border-radius:3px;margin-top:2px"></div>
      <div style="height:13px;background:${T.surface2};border-radius:3px"></div>
      <div style="height:13px;width:50%;background:${tone};border-radius:5px;margin-top:4px"></div>
    </div>
  </div>`;
}
function briefThumbnail(h){
  h=h||96;
  return `<div style="height:${h}px;border-radius:7px;background:${T.surface};border:1px solid ${T.border};padding:10px;display:flex;flex-direction:column;gap:5px;overflow:hidden">
    <div style="height:7px;width:50%;background:${T.border2};border-radius:3px"></div>
    <div style="height:4px;width:92%;background:${T.border};border-radius:3px;margin-top:3px"></div>
    <div style="height:4px;width:84%;background:${T.border};border-radius:3px"></div>
    <div style="height:4px;width:88%;background:${T.border};border-radius:3px"></div>
    <div style="height:4px;width:60%;background:${T.border};border-radius:3px"></div>
  </div>`;
}
function getThumbnail(card,h){
  if(card.kind==='wire')return wireThumbnail(h);
  if(card.kind==='brief')return briefThumbnail(h);
  return hifiThumbnail(card.tone||'#6f57d4',h);
}
function refThumb_form(){
  return `<div style="width:100%;height:100%;background:${T.surface};padding:7px;display:flex;flex-direction:column;gap:4px;overflow:hidden">
    <div style="height:5px;width:42%;background:${T.text};border-radius:2px;margin-bottom:3px"></div>
    <div style="height:4px;width:70%;background:${T.border2};border-radius:2px"></div>
    <div style="height:14px;border:1.5px solid ${T.border2};border-radius:3px;background:${T.surface2}"></div>

// ── PIPELINE RAIL ─────────────────────────────────────────────────────────────
function renderPipelineRail(){
  const ph=state.phase;
  const activeAgent=ph>0&&ph<8?PHASES[ph].agent:null;
  const doneAgents=new Set();
  for(let i=1;i<ph;i++){if(PHASES[i].agent)doneAgents.add(PHASES[i].agent);}
  if(ph>=7)doneAgents.add('ecd');

  let html=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:8px">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${T.text3};letter-spacing:1px;margin-bottom:6px">SEQUENTIAL PIPELINE</div>
        <div style="font-size:15px;font-weight:700;margin-bottom:3px">Design workflow spine</div>
        <div style="font-size:11.5px;color:${T.text3}">Use the <strong>AI Chat</strong> tab to direct agents.</div>
      </div>
      <button onclick="togglePipeline()" title="Close panel"
        style="width:26px;height:26px;flex:none;border-radius:7px;background:transparent;border:1px solid ${T.border};color:${T.text3};font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">‹</button>
    </div>
  `;

  AGENTS.forEach((agent,idx)=>{
    const isActive=agent.key===activeAgent;
    const isDone=doneAgents.has(agent.key);
    const isLast=idx===AGENTS.length-1;
    const statusText=isActive?'Working…':isDone?'Done':'Queued';
    const statusColor=isActive?agent.color:isDone?T.green:T.text3;
    const lineColor=isDone?agent.color:T.border;
    let dotHtml='';
    if(isActive){
      dotHtml=`<div style="position:relative;width:28px;height:28px;flex:none">
        <div style="position:absolute;inset:-5px;border-radius:13px;border:2px solid ${agent.color};opacity:.5;animation:ch-pulse 1.4s ease-in-out infinite"></div>
        <div style="width:28px;height:28px;border-radius:9px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:#fff;position:relative;z-index:1">${agent.short}</div>
      </div>`;
    }else if(isDone){
      dotHtml=`<div style="width:28px;height:28px;border-radius:9px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none">✓</div>`;
    }else{
      dotHtml=`<div style="width:28px;height:28px;border-radius:9px;background:transparent;border:1.5px solid ${T.border2};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:${T.text3};flex:none">${agent.short}</div>`;
    }
    html+=`
      <div style="display:flex;gap:11px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;align-items:center">
          ${dotHtml}
          ${!isLast?`<div style="width:2px;min-height:16px;background:${lineColor};margin:3px 0;flex:1"></div>`:''}
        </div>
        <div style="padding-top:3px;padding-bottom:${isLast?0:18}px;flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;line-height:1.2;margin-bottom:3px">${agent.name}</div>
          <div style="font-size:11px;color:${statusColor}">${statusText}</div>
        </div>
      </div>
    `;
  });

  html+=`
    <div style="margin-top:auto;padding-top:20px">
      <button onclick="resetFlow()" style="width:100%;border:1px solid ${T.border};background:${T.surface};color:${T.text2};border-radius:9px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">↺ Reset flow</button>
    </div>
  `;
  document.querySelector('.pipeline-rail').innerHTML=html;
}

function renderStage(){

  const stage=document.querySelector('.stage');
  const btnLabel=PHASE_BTN_LABELS[ph];
  const isGate=ph===3&&!state.selectedDir;
  const btnDisabled=isGate||ph>=7;
  const btnStyle=btnDisabled
    ?`background:${T.border};color:${T.text3};cursor:not-allowed;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;border:none;font-family:'Inter',sans-serif`

  stage.innerHTML=`

    ${ph<7?`
    <div style="flex:none;display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid ${T.border};margin-top:20px">
      <button id="next-btn" onclick="advance()" ${btnDisabled?'disabled':''} style="${btnStyle}">${btnLabel} <span style="font-size:16px">→</span></button>
      <span style="font-size:12px;color:${T.text3}">Step through the flow — each handoff is a visible event in the feed.</span>
      ${ph>=4?`<button onclick="openPrototype()" style="margin-left:auto;display:flex;align-items:center;gap:6px;background:transparent;border:1px solid ${T.border};border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;color:${T.text2};cursor:pointer;font-family:'Inter',sans-serif;transition:all .12s;white-space:nowrap" onmouseover="this.style.background='${T.brand}';this.style.color='${T.bgCanvas}';this.style.borderColor='${T.brand}'" onmouseout="this.style.background='transparent';this.style.color='${T.text2}';this.style.borderColor='${T.border}'">▶ Preview prototype</button>`:''}
    </div>
    `:''}
  `;

  Object.entries(state.editModes).forEach(([cardId,isEdit])=>{
    if(!isEdit)return;
    const card=document.getElementById(cardId);

function tagChip(tag){
  if(!tag)return'';
  if(tag==='parallel') return`<span class="tag-chip" style="color:${T.purple};background:${T.purpleLight}">PARALLEL · 3 AGENTS</span>`;
  if(tag==='promote')  return`<span class="tag-chip" style="color:${T.green};background:${T.greenLight}">GATE PASSED → PROMOTED</span>`;
  if(tag==='gate')     return`<span class="tag-chip" style="color:${T.blue};background:${T.blueLight}">GOVERNANCE</span>`;
  if(tag==='human')    return`<span class="tag-chip" style="color:${T.amber};background:${T.amberLight}">HUMAN IN THE LOOP</span>`;
  if(tag==='directed') return`<span class="tag-chip" style="color:${T.amber};background:${T.amberLight}">→ DIRECTED BY YOU</span>`;
  return'';
}

function findCard(id){
  const all=[
    ...BASE_CANVAS.exploring,...BASE_CANVAS.review,
    ...BASE_CANVAS.approved,...BASE_CANVAS.promoted,
  ];
  if(state.phase>=7&&state.selectedDir){
    const dir=DIRECTIONS.find(d=>d.id===state.selectedDir);
    all.unshift({id:'pr-fresh',kind:'hifi',kindLabel:'JUST PROMOTED',title:`Landing Page — Direction ${dir.id} · ${dir.name}`,fresh:true,agent:'ECD Agent',agentShort:'EC',agentColor:'#2f5bea',time:'just now',tone:dir.tone});
  }
  return all.find(c=>c.id===id);
}

  const agent=AGENT_MAP[step.a];

}

      <div>
        <label style="font-size:11.5px;font-weight:600;color:${T.text2};display:block;margin-bottom:6px">Lead designer</label>
        <div style="height:42px;border:1.5px solid ${T.border};border-radius:8px;background:${T.surface};display:flex;align-items:center;padding:0 12px;gap:8px">
          <div style="width:24px;height:24px;border-radius:50%;background:#6f57d4;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex:none">MC</div>
          <span style="font-size:13px;color:${T.text}">Maya Chen</span>
          <div style="margin-left:auto;color:${T.text3};font-size:11px">▾</div>
        </div>
      </div>
    </div>`;

  const fields=[
    ['Headline','Run production AI at 10× lower cost'],
    ['Audience','Technical'],
    ['Device Priority','Mobile'],
    ['Track','Bounce rate, Time on page'],
    ['Brand version',!isWire?'v2.1':'—'],
    ['Lead designer','Maya Chen'],
  ];
  return`${stepBar}
    <div style="max-width:530px">
      <div style="background:${isWire?T.surface2:T.surfaceWarm};border:1px solid ${T.border};border-radius:11px;padding:16px;margin-bottom:16px">
        <div style="font-size:9.5px;font-weight:700;color:${T.text3};letter-spacing:.5px;margin-bottom:12px">DESIGN BRIEF SUMMARY</div>
        <div style="display:flex;flex-direction:column;gap:9px">
          ${fields.map(([label,val])=>`
            <div style="display:flex;align-items:baseline;gap:10px;font-size:12.5px">
              <span style="color:${T.text3};min-width:100px;flex:none">${label}</span>
              <span style="color:${T.text};font-weight:400">${val}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div>
        <label style="font-size:11.5px;font-weight:600;color:${T.text2};display:block;margin-bottom:6px">Attach reference files <span style="font-size:10px;color:${T.text3};font-weight:400">optional</span></label>
        <div style="height:68px;border:1.5px dashed ${T.border2};border-radius:9px;background:${T.surface2};display:flex;align-items:center;justify-content:center;gap:8px">
          <span style="font-size:16px;color:${T.text3}">⬆</span>
          <span style="font-size:12px;color:${T.text3}">Drop files or <span style="color:${isWire?T.text3:acc};font-weight:600;border-bottom:1px solid ${isWire?T.border2:acc}66">browse</span></span>
        </div>
      </div>
    </div>`;
}

function renderPrototype(){
  const root=document.getElementById('proto-root');
  if(!root)return;
  if(!state.protoOpen){root.innerHTML='';return;}

  const ctx=getProtoContext();
  const isWire=ctx.fidelity==='wire';
  const acc=isWire?T.border2:ctx.tone;
  const s=state.protoScreen;
  const screenLabel=['Hero & above the fold','Value props & social proof','Review & launch'][s];
  const fLabel=isWire?'Wireframe':`Hi-fi${ctx.version?' v'+ctx.version:''}`;

  const browserChrome=`
    <div style="height:40px;background:#F0F1F5;border-bottom:1px solid #DDE0EA;display:flex;align-items:center;padding:0 12px;gap:8px;flex:none">
      <div style="display:flex;gap:5px">
        <div style="width:11px;height:11px;border-radius:50%;background:#FF5F57"></div>
        <div style="width:11px;height:11px;border-radius:50%;background:#FFBD2E"></div>
        <div style="width:11px;height:11px;border-radius:50%;background:#28CA41"></div>
      </div>
      <div style="flex:1;display:flex;justify-content:center">
        <div style="background:#fff;border:1px solid #D4D8E4;border-radius:6px;padding:5px 16px;font-size:11px;color:#555872;font-family:'JetBrains Mono',monospace;min-width:240px;text-align:center">
          🔒 neura.nova/landing/prototype
        </div>
      </div>
      <div style="width:60px"></div>
    </div>`;

  const appNav=`
    <div style="height:48px;background:${isWire?T.surface2:'#1a0a2e'};display:flex;align-items:center;padding:0 20px;gap:14px;flex:none;border-bottom:1px solid ${isWire?T.border:'rgba(255,255,255,.1)'}">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:24px;height:24px;border-radius:6px;background:${isWire?T.border2:acc};display:flex;align-items:center;justify-content:center;flex:none"><span style="font-size:8px;font-weight:800;color:#fff">NN</span></div>
        <span style="font-size:12px;font-weight:600;color:${isWire?T.text2:'rgba(255,255,255,.9)'}">Neura Nova</span>
      </div>
      <div style="display:flex;gap:1px;margin-left:10px">
        ${['Home','Product','Pricing','Blog'].map((n,i)=>`<div style="padding:5px 11px;border-radius:5px;font-size:11px;font-weight:${i===0?600:400};color:${i===0?(isWire?T.text:'#fff'):(isWire?T.text3:'rgba(255,255,255,.45)')};background:${i===0?(isWire?T.surface:'rgba(255,255,255,.12)'):'transparent'}">${n}</div>`).join('')}
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:9px">
        <div style="width:7px;height:7px;border-radius:50%;background:#4ade80"></div>
        <div style="width:28px;height:28px;border-radius:50%;background:#6f57d4;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none">MC</div>
      </div>
    </div>`;

  const pageFooter=`
    <div style="padding:12px 24px;border-top:1px solid ${T.border};display:flex;align-items:center;gap:10px;flex:none;background:${T.surface}">
      <button onclick="protoPrev()" ${s===0?'disabled':''} style="padding:9px 18px;border-radius:8px;border:1.5px solid ${T.border};background:transparent;color:${s===0?T.text3:T.text};font-size:12.5px;font-weight:600;cursor:${s===0?'default':'pointer'};font-family:'Inter',sans-serif;opacity:${s===0?.4:1}">← Back</button>
      <button onclick="${s<2?'protoNext()':'closePrototype()'}" style="padding:9px 20px;border-radius:8px;border:none;background:${isWire?T.brand:acc};color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif">
        ${s<2?'Continue →':'Submit Design Brief →'}
      </button>
      <span style="font-size:11px;color:${T.text3}">${s<2?'Progress is auto-saved':''}</span>
    </div>`;

  root.innerHTML=`
    <div onclick="if(event.target===this)closePrototype()" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:rgba(8,8,16,.82);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)">
      <div style="height:50px;background:#0C0C18;display:flex;align-items:center;padding:0 16px;gap:12px;flex:none;border-bottom:1px solid rgba(255,255,255,.07)">
        <button onclick="closePrototype()" style="display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:5px 11px;color:rgba(255,255,255,.8);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif" onmouseover="this.style.background='rgba(255,255,255,.14)'" onmouseout="this.style.background='rgba(255,255,255,.08)'">✕ Close</button>
        <div style="width:1px;height:18px;background:rgba(255,255,255,.1)"></div>
        <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,.88)">Neura Nova Landing Page <span style="color:rgba(255,255,255,.35)">·</span> <span style="color:rgba(255,255,255,.55);font-size:12px;font-weight:400">${fLabel}</span></div>
        <span style="font-size:11px;color:rgba(255,255,255,.28)">—</span>
        <span style="font-size:11.5px;color:rgba(255,255,255,.5)">${screenLabel}</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
          <button onclick="protoPrev()" ${s===0?'disabled':''} style="width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:rgba(255,255,255,${s===0?.2:.8});cursor:${s===0?'default':'pointer'};font-size:14px;display:flex;align-items:center;justify-content:center;font-family:sans-serif">‹</button>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.38);min-width:28px;text-align:center">${s+1}/3</span>
          <button onclick="protoNext()" ${s===2?'disabled':''} style="width:28px;height:28px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:rgba(255,255,255,${s===2?.2:.8});cursor:${s===2?'default':'pointer'};font-size:14px;display:flex;align-items:center;justify-content:center;font-family:sans-serif">›</button>
          <div style="width:1px;height:18px;background:rgba(255,255,255,.1);margin:0 4px"></div>
          <button id="proto-copy-btn" onclick="navigator.clipboard.writeText('neura.nova/landing/prototype/${isWire?'wireframe':'hifi-v'+(ctx.version||2)}').then(()=>{const b=document.getElementById('proto-copy-btn');b.textContent='Copied!';setTimeout(()=>b.textContent='🔗 Copy link',1600)})" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:5px 11px;color:rgba(255,255,255,.6);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">🔗 Copy link</button>
        </div>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px">
        <div style="width:860px;max-width:96%;background:${T.surface};border-radius:13px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;height:calc(100vh - 118px);max-height:610px;animation:ch-pop .28s ease backwards">
          ${browserChrome}
          ${appNav}
          <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column">
            <div style="padding:16px 24px 0;flex:none">
              <div style="font-size:11px;color:${T.text3};margin-bottom:4px">Landing Page <span>›</span> <span style="color:${T.text2};font-weight:600">New Design</span></div>
              <div style="font-size:20px;font-weight:700;color:${T.text};font-family:'Inter',sans-serif">Landing Page Design</div>
            </div>
            <div style="padding:18px 24px;flex:1">
              ${renderProtoPageContent(s,ctx.tone,isWire)}
            </div>
          </div>
          ${pageFooter}
        </div>
      </div>
    </div>`;
}

// ── MAIN RENDER + KEYBOARD ────────────────────────────────────────────────────
function render(){
  renderHeader();
  renderWorkspace();
  renderDrawer();
  renderPrototype();
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
  if(e.key===' '||e.key==='ArrowRight'){
    e.preventDefault();
    if(state.phase!==3||state.selectedDir)advance();
  }
  if(e.key==='Escape'){
    if(state.protoOpen)closePrototype();
    else if(state.detail)closeDetail();
  }
});

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chorus — Design Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;font-size:14px;color:var(--text);background:var(--bg-canvas)}
button{font-family:'Hanken Grotesk',sans-serif;border:none;cursor:pointer}
@keyframes ch-rise{from{transform:translateY(9px);opacity:0}to{transform:none;opacity:1}}
@keyframes ch-pop{0%{transform:translateY(12px) scale(.975);opacity:0}60%{transform:translateY(-2px) scale(1.008)}100%{transform:none;opacity:1}}
@keyframes ch-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes ch-flow{from{background-position:0 0}to{background-position:24px 0}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2,#cfcabd);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:13px;flex:none;z-index:10}
#body{flex:1;min-height:0;position:relative;display:flex}
#canvas-view{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
#workspace-view{flex:1;min-height:0;overflow:hidden;display:flex}
.pipeline-rail{width:248px;flex:none;background:var(--surface2);border-right:1px solid var(--border);padding:22px 18px;display:flex;flex-direction:column;overflow-y:auto}
.stage{flex:1;padding:30px 40px;overflow-y:auto;display:flex;flex-direction:column}
.feed-rail{width:298px;flex:none;background:var(--surface2);border-left:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;overflow-y:auto}
.canvas-board{flex:1;overflow-x:auto;overflow-y:hidden;padding:16px 20px 20px;display:flex;gap:14px;align-items:flex-start}
.canvas-col{flex:1;min-width:284px;background:var(--surface2);border-radius:13px;border:1px solid var(--border);display:flex;flex-direction:column;max-height:calc(100vh - 158px)}
.canvas-col-header{padding:14px 16px 12px;display:flex;align-items:center;gap:8px;flex:none}
.canvas-col-body{padding:10px 12px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.canvas-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;cursor:pointer;box-shadow:var(--shadow-sm);animation:ch-rise .4s ease;transition:box-shadow .15s,transform .15s}
.canvas-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.dir-card{background:var(--surface-warm);border:2px solid var(--border);border-radius:13px;padding:15px;cursor:pointer;transition:border-color .2s,opacity .2s;flex:1;min-width:210px}
.dir-card:hover{box-shadow:0 3px 12px rgba(20,18,12,.09)}
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;animation:ch-rise .35s ease;margin-bottom:9px}
.tag-chip{display:inline-flex;align-items:center;border-radius:5px;padding:3px 7px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;margin-top:7px}
.prov-step{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.prov-step:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <div id="body">
    <div id="canvas-view"></div>
    <div id="workspace-view" style="display:none"></div>
  </div>
</div>
<div id="drawer-root"></div>

<script>
// Read design system tokens — called at boot and after each theme toggle
function readTokens() {
  const s = getComputedStyle(document.documentElement);
  const get = v => s.getPropertyValue(v).trim();
  return {
    bgCanvas:    get('--bg-canvas')    || '#ecebe5',
    surface:     get('--surface')      || '#FDFAF6',
    surfaceWarm: get('--surface-warm') || '#fffdf8',
    surface2:    get('--surface2')     || '#E8E3D9',
    border:      get('--border')       || '#D8D2C6',
    border2:     get('--border2')      || '#C4BCAF',
    text:        get('--text')         || '#1C1914',
    text2:       get('--text2')        || '#6B6860',
    text3:       get('--text3')        || '#9C9890',
    brand:       get('--brand')        || '#1E1C18',
    brandLight:  get('--brand-light')  || '#EDEAE4',
    brandMid:    get('--brand-mid')    || '#9B8E83',
    stone:       get('--stone')        || '#7A6A5C',
    stoneLight:  get('--stone-light')  || '#F2EDE7',
    stoneMid:    get('--stone-mid')    || '#C4B5A8',
    blue:        get('--blue')         || '#2f5bea',
    blueLight:   get('--blue-light')   || '#e7eefe',
    green:       get('--green')        || '#2e8157',
    greenLight:  get('--green-light')  || '#e6f3ec',
    purple:      get('--purple')       || '#6f57d4',
    purpleLight: get('--purple-light') || '#efebfb',
    teal:        get('--teal')         || '#1f9d8f',
    amber:       get('--amber')        || '#c2700f',
    amberLight:  get('--amber-light')  || '#faeeda',
    red:         get('--red')          || '#d4456b',
    shadowSm:    get('--shadow-sm')    || '0 1px 2px rgba(28,25,20,.06)',
    shadowMd:    get('--shadow-md')    || '0 2px 8px rgba(28,25,20,.08)',
    shadowLg:    get('--shadow-lg')    || '0 4px 16px rgba(28,25,20,.10)',
    radiusSm:    get('--radius-sm')    || '4px',
    radius:      get('--radius')       || '6px',
    radiusLg:    get('--radius-lg')    || '8px',
    fontSans:    get('--font-sans')    || "'Hanken Grotesk', sans-serif",
    fontSerif:   get('--font-serif')   || "'Instrument Serif', serif",
    fontMono:    get('--font-mono')    || "'JetBrains Mono', monospace",
  };
}

let TOKENS = readTokens();

function isDark() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr === 'dark') return true;
  if (attr === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function toggleTheme() {
  const dark = isDark();
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  TOKENS = readTokens();
  render();
}

const AGENTS = [
  { key:'research',  name:'Research Agent',       short:'RE', color:'#1f9d8f' },
  { key:'strategy',  name:'Strategy Agent',        short:'ST', color:'#c2700f' },
  { key:'wireframe', name:'Wireframe Agent',       short:'WF', color:'#6f57d4' },
  { key:'visual',    name:'Visual Design Agent',   short:'VD', color:'#d4456b' },
  { key:'persona',   name:'Persona Review Agent',  short:'PR', color:'#2e8157' },
  { key:'ecd',       name:'ECD Agent',             short:'EC', color:'#2f5bea' },
];
const AGENT_MAP = Object.fromEntries(AGENTS.map(a => [a.key, a]));

const PHASES = [
  { agent:null,        kind:'idle',     eyebrow:'INTAKE',                      title:'A new brief just landed',                             sub:'The Research Agent picks it up and synthesizes context from the project sources.' },
  { agent:'research',  kind:'research', eyebrow:'RESEARCH AGENT',              title:'Research Brief',                                      sub:'Six inputs synthesized into the signal that matters.' },
  { agent:'strategy',  kind:'strategy', eyebrow:'STRATEGY AGENT',              title:'Design Brief',                                        sub:'Goals, persona and constraints — with the design system wired in.' },
  { agent:'wireframe', kind:'concepts', eyebrow:'WIREFRAME AGENT · PARALLEL',  title:'Three directions, generated at once',                  sub:'The Wireframe Agent ran three explorations in parallel, all grounded in the same brief. A human picks the direction.' },
  { agent:'visual',    kind:'visual',   eyebrow:'VISUAL DESIGN AGENT',         title:'Hi-fi concept',                                       sub:'The Visual Design Agent applied the Helios Design System to the chosen direction.' },
  { agent:'persona',   kind:'persona',  eyebrow:'PERSONA REVIEW AGENT',        title:'Persona review',                                      sub:'Validated against the defined persona. This is the AI governance moment.' },
  { agent:'ecd',       kind:'ecd',      eyebrow:'ECD AGENT · GATE',            title:'Executive Creative Director gate',                    sub:'The ECD reviews the feedback and the concept, then a human confirms the promotion.' },
  { agent:'ecd',       kind:'promoted', eyebrow:'PROMOTED',                    title:'Promoted to the Shared Canvas',                       sub:'Traceable from brief to approved — now visible to the whole team.' },
];

const DIRECTIONS = [
  { id:'A', name:'Single screen',     desc:'Everything on one focused screen — minimal steps.',      tone:'#6f57d4' },
  { id:'B', name:'Progressive steps', desc:'Guided multi-step flow with a visible progress rail.',   tone:'#2f5bea' },
  { id:'C', name:'Conversational',    desc:'Chat-led setup that adapts to each answer.',             tone:'#1f9d8f' },
];

const PHASE_BTN_LABELS = [
  'Start the flow',
  'Continue',
  'Continue',
  'Select a direction to continue',
  'Run persona review',
  'Send to ECD review',
  'Approve & promote to canvas',
  'Flow complete',
];

const PHASE_EVENTS = {
  1: [{ a:'research',  t:'Synthesized 6 inputs into a Research Brief', tag:'' }],
  2: [
    { a:'strategy', t:'Converted brief → Design Brief (goals · persona · constraints)', tag:'' },
    { a:'ecd',      t:'Flagged Design Brief ready for concepting', tag:'gate' },
  ],
  3: [{ a:'wireframe', t:'Spawned 3 directions in parallel · all Exploring', tag:'parallel' }],
  4: [{ a:'visual',    t:'Applied Helios Design System to selected direction', tag:'' }],
  5: [{ a:'persona',   t:'Returned structured feedback vs. persona "Maya"', tag:'' }],
  6: [{ a:'ecd',       t:'Reviewed persona feedback — concept meets the bar', tag:'' }],
  7: [{ a:'ecd',       t:'Approved & promoted to Shared Canvas', tag:'promote' }],
};

const PROV_BY_KIND = {
  wire: [
    { a:'strategy',  t:'Design Brief handed off', tag:'' },
    { a:'wireframe', t:'Generated as one of 3 parallel directions', tag:'parallel' },
  ],
  hifi: [
    { a:'wireframe', t:'Wireframe direction selected by human', tag:'human' },
    { a:'visual',    t:'Helios Design System applied', tag:'' },
    { a:'persona',   t:'Persona review returned', tag:'' },
    { a:'ecd',       t:'ECD approved · promoted', tag:'promote' },
  ],
  brief: [
    { a:'research', t:'Synthesized 6 project inputs', tag:'' },
    { a:'ecd',      t:'Promoted to shared canvas', tag:'promote' },
  ],
};

const IDENTITY_NAMES = ['Chorus', 'Quorum', 'Atelier'];

const state = {
  view: 'canvas',
  phase: 0,
  selectedDir: null,
  events: [],
  detail: null,
  identityIdx: 0,
};

const BASE_CANVAS = {
  exploring: [
    { id:'ex-a', kind:'wire', kindLabel:'WIREFRAME', title:'Direction A — Single screen',      agent:'Wireframe Agent', agentShort:'WF', agentColor:'#6f57d4', time:'4m' },
    { id:'ex-b', kind:'wire', kindLabel:'WIREFRAME', title:'Direction B — Progressive steps',  agent:'Wireframe Agent', agentShort:'WF', agentColor:'#6f57d4', time:'4m' },
    { id:'ex-c', kind:'wire', kindLabel:'WIREFRAME', title:'Direction C — Conversational',     agent:'Wireframe Agent', agentShort:'WF', agentColor:'#6f57d4', time:'4m' },
  ],
  review: [
    { id:'rv-b', kind:'hifi', kindLabel:'HI-FI CONCEPT', title:'Direction B — design system applied', agent:'Visual Design Agent', agentShort:'VD', agentColor:'#d4456b', time:'1m', tone:'#6f57d4' },
  ],
  approved: [
    { id:'ap-1', kind:'hifi', kindLabel:'HI-FI CONCEPT', title:'Welcome + value proposition', agent:'ECD Agent', agentShort:'EC', agentColor:'#2f5bea', time:'just now', tone:'#2e8157' },
  ],
  promoted: [
    { id:'pr-1', kind:'hifi',  kindLabel:'PROMOTED',        title:'Onboarding hero — v1',                        agent:'ECD Agent',      agentShort:'EC', agentColor:'#2f5bea', time:'2h',  tone:'#2f5bea' },
    { id:'pr-2', kind:'brief', kindLabel:'RESEARCH BRIEF',  title:'Helios onboarding — context synthesis',       agent:'Research Agent', agentShort:'RE', agentColor:'#1f9d8f', time:'3h' },
  ],
};

function setState(updates) {
  Object.assign(state, updates);
  render();
}

function setView(v) { setState({ view: v }); }

function advance() {
  if (state.phase === 3 && !state.selectedDir) return;
  if (state.phase >= 7) return;
  const next = state.phase + 1;
  const newEvents = (PHASE_EVENTS[next] || []).map(e => ({ ...e }));
  setState({ phase: next, events: [...newEvents, ...state.events] });
}

function resetFlow() { setState({ phase: 0, selectedDir: null, events: [] }); }

function selectDir(id) {
  if (state.phase === 3) setState({ selectedDir: id });
}

function cycleIdentity() {
  setState({ identityIdx: (state.identityIdx + 1) % IDENTITY_NAMES.length });
}

function openDetail(cardId) { setState({ detail: cardId }); }
function closeDetail() { setState({ detail: null }); }

// ─── THUMBNAIL BUILDERS ───────────────────────────────────────────────────────

function wireThumbnail(h) {
  h = h || 96;
  return `<div style="height:${h}px;border-radius:7px;background:${TOKENS.surfaceWarm};border:1px solid ${TOKENS.border};padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden">
    <div style="display:flex;gap:5px;align-items:center">
      <div style="width:11px;height:11px;border:1.5px solid ${TOKENS.border2};border-radius:3px;flex:none"></div>
      <div style="height:6px;width:34%;background:${TOKENS.border2};border-radius:2px"></div>
      <div style="height:9px;width:18px;border:1.5px solid ${TOKENS.border2};border-radius:3px;margin-left:auto"></div>
    </div>
    <div style="flex:1;border:1.5px dashed ${TOKENS.border};border-radius:4px;background:linear-gradient(to top right,transparent calc(50% - .8px),${TOKENS.surface2},transparent calc(50% + .8px)),linear-gradient(to top left,transparent calc(50% - .8px),${TOKENS.surface2},transparent calc(50% + .8px))"></div>
    <div style="display:flex;gap:5px;align-items:center">
      <div style="height:9px;flex:1;border:1.5px solid ${TOKENS.border2};border-radius:3px"></div>
      <div style="height:9px;width:26px;background:${TOKENS.border2};border-radius:3px"></div>
    </div>
  </div>`;
}

function hifiThumbnail(tone, h) {
  h = h || 96;
  return `<div style="height:${h}px;border-radius:7px;background:${TOKENS.surface};border:1px solid ${TOKENS.border};overflow:hidden;display:flex;flex-direction:column">
    <div style="height:30px;background:${tone};display:flex;align-items:center;padding:0 9px;gap:5px;flex:none">
      <div style="width:30%;height:6px;background:rgba(255,255,255,.85);border-radius:3px"></div>
      <div style="width:14px;height:9px;background:rgba(255,255,255,.5);border-radius:3px;margin-left:auto"></div>
    </div>
    <div style="flex:1;padding:9px;display:flex;flex-direction:column;gap:5px">
      <div style="height:6px;width:66%;background:${TOKENS.surface2};border-radius:3px"></div>
      <div style="height:5px;width:88%;background:${TOKENS.border};border-radius:3px"></div>
      <div style="height:14px;width:44px;background:${tone};border-radius:5px;margin-top:auto"></div>
    </div>
  </div>`;
}

function briefThumbnail(h) {
  h = h || 96;
  return `<div style="height:${h}px;border-radius:7px;background:${TOKENS.surface};border:1px solid ${TOKENS.border};padding:10px;display:flex;flex-direction:column;gap:5px;overflow:hidden">
    <div style="height:7px;width:50%;background:${TOKENS.border2};border-radius:3px"></div>
    <div style="height:4px;width:92%;background:${TOKENS.border};border-radius:3px;margin-top:3px"></div>
    <div style="height:4px;width:84%;background:${TOKENS.border};border-radius:3px"></div>
    <div style="height:4px;width:88%;background:${TOKENS.border};border-radius:3px"></div>
    <div style="height:4px;width:60%;background:${TOKENS.border};border-radius:3px"></div>
  </div>`;
}

function getThumbnail(card, h) {
  if (card.kind === 'wire') return wireThumbnail(h);
  if (card.kind === 'brief') return briefThumbnail(h);
  return hifiThumbnail(card.tone || '#6f57d4', h);
}

// ─── HEADER ──────────────────────────────────────────────────────────────────

function renderHeader() {
  const name = IDENTITY_NAMES[state.identityIdx];
  const isCanvas = state.view === 'canvas';
  const isWork = state.view === 'workspace';
  document.getElementById('header').innerHTML = `
    <div style="display:flex;align-items:center;gap:9px;cursor:pointer" onclick="cycleIdentity()">
      <div style="width:26px;height:26px;border-radius:7px;background:${TOKENS.text};display:flex;align-items:center;justify-content:center;flex:none">
        <div style="display:flex;align-items:flex-end;gap:2px;height:13px">
          <span style="width:2.5px;height:6px;background:#ffd166;border-radius:2px"></span>
          <span style="width:2.5px;height:13px;background:${TOKENS.bgCanvas};border-radius:2px"></span>
          <span style="width:2.5px;height:9px;background:#7aa2ff;border-radius:2px"></span>
        </div>
      </div>
      <span id="wordmark" style="font-family:'Instrument Serif',serif;font-size:23px;letter-spacing:.3px;line-height:1">${name}</span>
      <span style="font-size:9px;font-family:'JetBrains Mono',monospace;color:${TOKENS.text3};border:1px solid ${TOKENS.border};border-radius:4px;padding:2px 5px;letter-spacing:.5px">BETA</span>
    </div>
    <div style="width:1px;height:24px;background:${TOKENS.border};flex:none"></div>
    <div style="font-size:13px;color:${TOKENS.text2}">Project / <span style="color:${TOKENS.text};font-weight:600">Helios — Onboarding Redesign</span></div>
    <div style="margin:0 auto;display:flex;background:${TOKENS.surface2};border:1px solid ${TOKENS.border};border-radius:10px;padding:3px;gap:2px">
      <button id="btn-canvas" onclick="setView('canvas')" style="background:${isCanvas?TOKENS.brand:'transparent'};color:${isCanvas?TOKENS.bgCanvas:TOKENS.text2};border-radius:8px;border:none;padding:7px 15px;font-weight:600;font-size:13px;font-family:'Hanken Grotesk',sans-serif;cursor:pointer;transition:all .15s">Shared Canvas</button>
      <button id="btn-workspace" onclick="setView('workspace')" style="background:${isWork?TOKENS.brand:'transparent'};color:${isWork?TOKENS.bgCanvas:TOKENS.text2};border-radius:8px;border:none;padding:7px 15px;font-weight:600;font-size:13px;font-family:'Hanken Grotesk',sans-serif;cursor:pointer;transition:all .15s">Design Team</button>
    </div>
    <button onclick="toggleTheme()" title="Toggle light/dark" style="width:32px;height:32px;border-radius:8px;background:${TOKENS.surface2};border:1px solid ${TOKENS.border};display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:${TOKENS.text2};transition:all .15s;margin-left:auto;flex:none" onmouseover="this.style.background='${TOKENS.border}'" onmouseout="this.style.background='${TOKENS.surface2}'">${isDark() ? '☀︎' : '◑'}</button>
    <div style="display:flex;align-items:center">
      <div style="display:flex">
        <div style="width:30px;height:30px;border-radius:50%;background:#d4456b;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;z-index:3">MK</div>
        <div style="width:30px;height:30px;border-radius:50%;background:#2e8157;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-left:-8px;z-index:2">JL</div>
        <div style="width:30px;height:30px;border-radius:50%;background:#c2700f;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-left:-8px;z-index:1">+3</div>
      </div>
    </div>
  `;
}

// ─── CANVAS VIEW ─────────────────────────────────────────────────────────────

function renderCanvas() {
  const el = document.getElementById('canvas-view');
  const promotedCards = [...BASE_CANVAS.promoted];
  if (state.phase >= 7 && state.selectedDir) {
    const dir = DIRECTIONS.find(d => d.id === state.selectedDir);
    const fresh = { id:'pr-fresh', kind:'hifi', kindLabel:'JUST PROMOTED', title:`Onboarding — Direction ${dir.id} · ${dir.name}`, fresh:true, agent:'ECD Agent', agentShort:'EC', agentColor:'#2f5bea', time:'just now', tone:dir.tone };
    promotedCards.unshift(fresh);
  }

  const cols = [
    { key:'exploring', label:'Exploring', color:'#a9762a', cards: BASE_CANVAS.exploring },
    { key:'review',    label:'In Review', color:'#6f57d4', cards: BASE_CANVAS.review },
    { key:'approved',  label:'Approved',  color:'#2e8157', cards: BASE_CANVAS.approved },
    { key:'promoted',  label:'Promoted',  color:'#2f5bea', cards: promotedCards },
  ];

  el.innerHTML = `
    <div style="padding:20px 28px 16px;display:flex;align-items:center;flex:none;border-bottom:1px solid ${TOKENS.border};background:${TOKENS.surface}">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.2px;color:${TOKENS.text3};margin-bottom:5px">SHARED PROJECT CANVAS</div>
        <div style="font-family:'Instrument Serif',serif;font-size:28px;line-height:1.1;color:${TOKENS.text}">All work in motion, in one governed view</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:7px">
        <span style="width:6px;height:6px;border-radius:50%;background:#2f5bea;flex:none"></span>
        <span style="font-size:12.5px;color:${TOKENS.text2}">Promotions require a gate</span>
      </div>
    </div>
    <div style="flex:1;overflow:hidden">
      <div class="canvas-board">
        ${cols.map(col => `
          <div class="canvas-col">
            <div style="height:3px;background:${col.color};border-radius:13px 13px 0 0;flex:none"></div>
            <div class="canvas-col-header">
              <span style="width:8px;height:8px;border-radius:50%;background:${col.color};flex:none"></span>
              <span style="font-size:14px;font-weight:600;flex:1;color:${TOKENS.text}">${col.label}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${TOKENS.text3}">${col.cards.length}</span>
            </div>
            <div style="height:1px;background:${TOKENS.border};margin:0 14px;flex:none"></div>
            <div class="canvas-col-body">
              ${col.cards.length === 0
                ? `<div style="padding:20px;text-align:center;font-size:12px;color:${TOKENS.text3};font-style:italic">No artifacts yet</div>`
                : col.cards.map(card => renderCanvasCard(card)).join('')
              }

          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderCanvasCard(card) {
  const freshStyle = card.fresh ? `border-color:${card.tone};box-shadow:0 0 0 2px ${card.tone}22;` : '';
  const kindColor = card.kindLabel === 'WIREFRAME' ? '#6f57d4'
    : card.kindLabel === 'RESEARCH BRIEF' ? '#1f9d8f'
    : card.kindLabel === 'PROMOTED' || card.kindLabel === 'JUST PROMOTED' ? '#2f5bea'
    : card.agentColor;
  return `
    <div class="canvas-card" style="${freshStyle}" onclick="openDetail('${card.id}')">
      <div style="display:flex;align-items:center;margin-bottom:8px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:${kindColor};letter-spacing:.5px">${card.kindLabel}</span>
        <span style="font-size:11px;color:${TOKENS.text3};margin-left:auto">${card.time}</span>
      </div>
      ${getThumbnail(card, 104)}
      <div style="font-size:13px;font-weight:600;line-height:1.35;margin-top:9px;margin-bottom:6px;color:${TOKENS.text}">${card.title}</div>

        <span style="font-size:11.5px;color:${TOKENS.text2}">${card.agent}</span>

}

// ─── PIPELINE RAIL ────────────────────────────────────────────────────────────

function renderPipelineRail() {
  const ph = state.phase;
  const activeAgent = ph > 0 && ph < 8 ? PHASES[ph].agent : null;
  const doneAgents = new Set();
  for (let i = 1; i < ph; i++) {
    if (PHASES[i].agent) doneAgents.add(PHASES[i].agent);
  }
  // Phase 7: ecd is done
  if (ph >= 7) doneAgents.add('ecd');

  let html = `
    <div style="margin-bottom:20px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${TOKENS.text3};letter-spacing:1px;margin-bottom:6px">SEQUENTIAL PIPELINE</div>
      <div style="font-size:15px;font-weight:700">Design workflow spine</div>
    </div>
  `;

  AGENTS.forEach((agent, idx) => {
    const isActive = agent.key === activeAgent;
    const isDone = doneAgents.has(agent.key);
    const isPending = !isActive && !isDone;
    const isLast = idx === AGENTS.length - 1;

    let dotHtml = '';
    if (isActive) {
      dotHtml = `
        <div style="position:relative;width:28px;height:28px;flex:none">
          <div style="position:absolute;inset:-5px;border-radius:13px;border:2px solid ${agent.color};opacity:.5;animation:ch-pulse 1.4s ease-in-out infinite"></div>
          <div style="width:28px;height:28px;border-radius:9px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:#fff;position:relative;z-index:1">${agent.short}</div>
        </div>`;
    } else if (isDone) {
      dotHtml = `<div style="width:28px;height:28px;border-radius:9px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none">✓</div>`;
    } else {
      dotHtml = `<div style="width:28px;height:28px;border-radius:9px;background:transparent;border:1.5px solid ${TOKENS.border2};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:${TOKENS.text3};flex:none">${agent.short}</div>`;
    }

    const statusText = isActive ? 'Working…' : isDone ? 'Done' : 'Queued';
    const statusColor = isActive ? agent.color : isDone ? TOKENS.green : TOKENS.text3;
    const lineColor = isDone ? agent.color : TOKENS.border;

    html += `
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;align-items:center;gap:0">
          ${dotHtml}
          ${!isLast ? `<div style="width:2px;min-height:18px;background:${lineColor};margin:3px 0;flex:1"></div>` : ''}
        </div>
        <div style="padding-top:4px;padding-bottom:${isLast?0:20}px">
          <div style="font-size:13px;font-weight:600;line-height:1.2">${agent.name}</div>
          <div style="font-size:11px;color:${statusColor};margin-top:2px">${statusText}</div>
        </div>
      </div>
    `;
  });

  html += `
    <div style="margin-top:auto;padding-top:20px">
      <button onclick="resetFlow()" style="width:100%;border:1px solid ${TOKENS.border};background:${TOKENS.surface};color:${TOKENS.text2};border-radius:9px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Hanken Grotesk',sans-serif">↺ Reset flow</button>
    </div>
  `;

  document.querySelector('.pipeline-rail').innerHTML = html;
}

  if (tag === 'promote') return `<span class="tag-chip" style="color:${TOKENS.green};background:${TOKENS.greenLight}">GATE PASSED → PROMOTED</span>`;
  if (tag === 'gate') return `<span class="tag-chip" style="color:${TOKENS.blue};background:${TOKENS.blueLight}">GOVERNANCE</span>`;
  if (tag === 'human') return `<span class="tag-chip" style="color:${TOKENS.amber};background:${TOKENS.amberLight}">HUMAN IN THE LOOP</span>`;
  return '';
}

function renderFeed() {
  const feed = document.querySelector('.feed-rail');
  const events = state.events;

  let eventsHtml = '';
  if (events.length === 0) {
    eventsHtml = `<div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"><div style="font-size:13px;color:${TOKENS.text3};line-height:1.55">Start the flow to watch the team and its agents work in the open.</div></div>`;
  } else {
    eventsHtml = `<div style="flex:1;overflow-y:auto">${events.map(ev => {
      const agent = AGENT_MAP[ev.a];
      return `
        <div class="event-card">
          <div style="display:flex;align-items:center;margin-bottom:6px">
            <div style="width:20px;height:20px;border-radius:5px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#fff;flex:none">${agent.short}</div>
            <span style="font-size:12px;font-weight:700;margin-left:7px">${agent.name}</span>
            <span style="font-size:11px;color:${TOKENS.text3};margin-left:auto">just now</span>
          </div>
          <div style="font-size:12.5px;color:${TOKENS.text2};line-height:1.45">${ev.t}</div>
          ${tagChip(ev.tag)}
        </div>
      `;
    }).join('')}</div>`;
  }

  feed.innerHTML = `
    <div style="margin-bottom:16px;flex:none">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${TOKENS.text3};letter-spacing:1px;margin-bottom:6px">ACTIVITY FEED</div>
      <div style="font-size:14px;font-weight:700">Every agent action, visible</div>
    </div>
    ${eventsHtml}
  `;
}

// ─── WORKSPACE ────────────────────────────────────────────────────────────────

function renderWorkspace() {
  const ws = document.getElementById('workspace-view');
  ws.innerHTML = `
    <aside class="pipeline-rail"></aside>
    <main class="stage"></main>
    <aside class="feed-rail"></aside>
  `;
  renderPipelineRail();
  renderStage();
  renderFeed();
}

// ─── DETAIL DRAWER ────────────────────────────────────────────────────────────

function findCard(id) {
  const all = [
    ...BASE_CANVAS.exploring,
    ...BASE_CANVAS.review,
    ...BASE_CANVAS.approved,
    ...BASE_CANVAS.promoted,
  ];
  if (state.phase >= 7 && state.selectedDir) {
    const dir = DIRECTIONS.find(d => d.id === state.selectedDir);
    all.unshift({ id:'pr-fresh', kind:'hifi', kindLabel:'JUST PROMOTED', title:`Onboarding — Direction ${dir.id} · ${dir.name}`, fresh:true, agent:'ECD Agent', agentShort:'EC', agentColor:'#2f5bea', time:'just now', tone:dir.tone });
  }
  return all.find(c => c.id === id);
}

function provStep(step) {
  const agent = AGENT_MAP[step.a];
  return `
    <div class="prov-step">
      <div style="width:20px;height:20px;border-radius:5px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#fff;flex:none;margin-top:1px">${agent.short}</div>
      <div>
        <div style="font-size:12px;font-weight:600;color:${TOKENS.text}">${agent.name}</div>
        <div style="font-size:12px;color:${TOKENS.text2};line-height:1.4">${step.t}</div>
        ${step.tag ? `<div>${tagChip(step.tag)}</div>` : ''}
      </div>
    </div>
  `;
}

function renderDrawer() {
  const root = document.getElementById('drawer-root');
  if (!state.detail) { root.innerHTML = ''; return; }

  const card = findCard(state.detail);
  if (!card) { root.innerHTML = ''; return; }

  const tone = card.tone || card.agentColor || '#6f57d4';
  const kindColor = card.agentColor || tone;
  const prov = PROV_BY_KIND[card.kind] || [];
  const isHifi = card.kind === 'hifi';
  const isApproved = card.kindLabel === 'PROMOTED' || card.kindLabel === 'JUST PROMOTED' || card.id === 'ap-1';

  const statusText = card.kindLabel === 'PROMOTED' || card.kindLabel === 'JUST PROMOTED' ? 'Promoted'
    : card.id === 'ap-1' ? 'Approved'
    : card.id === 'rv-b' ? 'In Review'
    : 'Exploring';

  const personaMini = isHifi ? `
    <div style="border-top:1px solid ${TOKENS.border};padding-top:14px;margin-top:14px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.8px;color:${TOKENS.text3};font-weight:600;margin-bottom:10px">PERSONA REVIEW</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px">
          <span style="color:${TOKENS.green};font-weight:700;flex:none">✓</span>
          <span>Sample workspace removes blank-page fear.</span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px">
          <span style="color:${TOKENS.green};font-weight:700;flex:none">✓</span>
          <span>Single primary action — easy to follow.</span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px;background:${TOKENS.amberLight};border-radius:7px;padding:8px;border:1px solid ${isDark()?'#5a4010':'#ecd9a8'}">
          <span style="color:${TOKENS.amber};font-weight:700;flex:none">!</span>
          <span>Step 2 uses "configure" — too technical for Maya.</span>
        </div>
      </div>
    </div>
  ` : '';

  const ecdMini = isApproved ? `
    <div style="background:${TOKENS.blueLight};border-radius:10px;padding:12px;margin-top:14px;border:1px solid ${isDark()?'#1a3070':'#cfdcfb'}">
      <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.8px;color:${TOKENS.blue};font-weight:600;margin-bottom:8px">ECD GATE PASSED</div>
      <div style="font-size:12.5px;line-height:1.45;color:${isDark()?'#7a9ef5':'#1e3a8a'}">Concept meets the brief. Design system applied consistently. Promoted to shared canvas.</div>
    </div>
  ` : '';

  root.innerHTML = `
    <div style="position:absolute;inset:0;z-index:50;display:flex;justify-content:flex-end">
      <div style="position:absolute;inset:0;background:rgba(24,23,26,.32);animation:ch-rise .2s ease" onclick="closeDetail()"></div>
      <div style="width:420px;max-width:90vw;height:100%;background:${TOKENS.surface};border-left:1px solid ${TOKENS.border};box-shadow:-12px 0 40px rgba(20,18,12,.14);animation:ch-rise .25s ease;overflow-y:auto;position:relative;z-index:1;display:flex;flex-direction:column">
        <div style="padding:20px 20px 16px;border-bottom:1px solid ${TOKENS.border};flex:none">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:${kindColor};letter-spacing:.5px">${card.kindLabel}</span>
            <div style="display:flex;align-items:center;gap:5px;margin-left:auto;background:${TOKENS.surface2};border-radius:6px;padding:4px 9px">
              <span style="width:6px;height:6px;border-radius:50%;background:${kindColor};flex:none"></span>
              <span style="font-size:11.5px;font-weight:600;color:${TOKENS.text}">${statusText}</span>
            </div>
            <button onclick="closeDetail()" style="background:transparent;border:1px solid ${TOKENS.border};border-radius:7px;padding:5px 10px;font-size:14px;color:${TOKENS.text2};cursor:pointer;flex:none">✕</button>
          </div>
          <div style="font-family:'Instrument Serif',serif;font-size:24px;line-height:1.25;margin-bottom:12px">${card.title}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:20px;height:20px;border-radius:5px;background:${card.agentColor};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#fff;flex:none">${card.agentShort}</div>
            <span style="font-size:12.5px;color:${TOKENS.text2}">Owned by ${card.agent}</span>
          </div>
        </div>
        <div style="padding:18px 20px;flex:1;overflow-y:auto">
          ${isHifi ? `<div style="margin-bottom:18px">${hifiThumbnail(tone, 130)}</div>` : ''}
          ${card.kind === 'wire' ? `<div style="margin-bottom:18px">${wireThumbnail(100)}</div>` : ''}
          ${card.kind === 'brief' ? `<div style="margin-bottom:18px">${briefThumbnail(100)}</div>` : ''}
          <div style="border-top:1px solid ${TOKENS.border};padding-top:14px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.8px;color:${TOKENS.text3};font-weight:600;margin-bottom:4px">PROVENANCE · how this got here</div>
            ${prov.map(provStep).join('')}
          </div>
          ${personaMini}
          ${ecdMini}
        </div>
      </div>
    </div>
  `;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────

function render() {
  renderHeader();

  const canvasEl = document.getElementById('canvas-view');
  const workspaceEl = document.getElementById('workspace-view');

  if (state.view === 'canvas') {
    canvasEl.style.display = 'flex';
    workspaceEl.style.display = 'none';
    renderCanvas();
  } else {
    canvasEl.style.display = 'none';
    workspaceEl.style.display = 'flex';
    renderWorkspace();
  }

  renderDrawer();
}

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (state.phase !== 3 || state.selectedDir) advance();
  }
  if (e.key === 'Escape' && state.detail) closeDetail();
});

// ─── BOOT ─────────────────────────────────────────────────────────────────────

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weave Studio — Neura Nova</title>
<link rel="shortcut icon" href="/weave-logo.png"><link rel="icon" type="image/png" sizes="64x64" href="/weave-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg-canvas)}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
[contenteditable]{outline:none}
[contenteditable]:focus{background:color-mix(in srgb,var(--brand) 6%,transparent);border-radius:4px;padding:0 2px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.97) translateY(6px)}60%{transform:scale(1.01)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* LAYOUT */
#app{height:100vh;display:flex;flex-direction:column}
#toolbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:7px;flex:none;z-index:30}
#body{flex:1;min-height:0;display:flex;overflow:hidden}
.left-rail{width:220px;flex:none;background:var(--surface2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;overflow:auto;position:relative}
.right-rail{width:272px;flex:none;background:var(--surface2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

/* TOOLBAR */
.tb-logo{width:26px;height:26px;border-radius:7px;background:var(--brand);flex:none}
.tb-sep{width:1px;height:16px;background:var(--border);flex:none;margin:0 2px}
.mode-tabs{display:flex;gap:1px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:3px}
.mode-tab{padding:4px 11px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text2);background:transparent;transition:all .14s;white-space:nowrap}
.mode-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tb-space{flex:1}
.tb-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:12px;font-weight:600;color:var(--text2);transition:all .14s;white-space:nowrap}
.tb-btn:hover{background:var(--surface);color:var(--text)}
.tb-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}

/* LEFT RAIL */
.rail-hdr{padding:14px 14px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);flex:none}
.page-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;transition:background .12s}
.page-item:hover{background:color-mix(in srgb,var(--brand) 6%,transparent)}
.page-item.active{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.page-item.active .pi-label{color:var(--brand);font-weight:700}
.pi-icon{font-size:14px;flex:none}
.pi-label{font-size:13px;font-weight:500}
.rail-add{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;color:var(--text3);cursor:pointer;background:none;border:none;transition:color .12s;font-family:'Inter',sans-serif}
.rail-add:hover{color:var(--brand)}
.agent-strip{border-top:1px solid var(--border);padding:12px 14px;flex:none}
.agent-strip-hdr{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
.agent-dot-row{display:flex;gap:6px;flex-wrap:wrap}
.agent-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:#fff;cursor:pointer;transition:opacity .12s}
.agent-dot:hover{opacity:.8}

/* RIGHT RAIL */
.rtabs{display:flex;border-bottom:1px solid var(--border);flex:none;background:var(--surface)}
.rtab{flex:1;padding:9px 4px;font-size:11.5px;font-weight:600;color:var(--text3);background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .14s;display:flex;align-items:center;justify-content:center;gap:4px}
.rtab.active{color:var(--brand);border-bottom-color:var(--brand)}
.rbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ag-card{background:var(--surface);border-radius:11px;padding:13px;border:1px solid var(--border);animation:rise .3s ease}
.ag-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ag-badge{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:#fff;flex:none}
.ag-name{font-size:12.5px;font-weight:700}
.ag-contrib{display:flex;flex-direction:column;gap:4px}
.ag-contrib-item{font-size:11.5px;color:var(--text2);display:flex;gap:6px;line-height:1.4}
.ag-contrib-dot{width:5px;height:5px;border-radius:50%;flex:none;margin-top:5px}
.ag-chat-btn{width:100%;margin-top:9px;padding:6px;border-radius:7px;font-size:11.5px;font-weight:600;background:transparent;border:1px solid var(--border);color:var(--text2);transition:all .13s;font-family:'Inter',sans-serif}
.ag-chat-btn:hover{background:var(--surface2);color:var(--text)}
.chat-area{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;min-height:0}
.chat-bubble{border-radius:10px;padding:9px 12px;max-width:220px;font-size:12.5px;line-height:1.45;animation:rise .25s ease}
.chat-ai{background:var(--surface);border:1px solid var(--border);border-radius:10px 10px 10px 3px;align-self:flex-start}
.chat-user{background:var(--brand);color:#fff;align-self:flex-end;border-radius:10px 10px 3px 10px}
.typing-dots{display:flex;gap:4px;padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:10px;width:fit-content}
.typing-dot{width:4px;height:4px;border-radius:50%;background:var(--text3);animation:pulse .9s infinite}
.chat-input-row{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--border);flex:none}
.chat-input{flex:1;height:32px;border:1.5px solid var(--border);border-radius:7px;padding:0 9px;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text);background:var(--surface)}
.chat-input:focus{border-color:var(--brand);outline:none}
.chat-send{height:32px;padding:0 11px;border-radius:7px;background:var(--brand);color:#fff;font-size:12px;font-weight:600}
.comment{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px}
.comment-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.comment-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.comment-tag{display:inline-flex;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:6px}
.hist-item{display:flex;align-items:flex-start;gap:8px}
.hist-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:3px}
.hist-bar{width:1.5px;flex:1;background:var(--border);min-height:16px;margin-top:3px}

/* FLOW MODE */
.flow-wrap{position:relative;display:flex;padding:32px 32px 64px;gap:0;min-height:100%}
.flow-svg{position:absolute;inset:0;pointer-events:none;z-index:0}
.flow-col{display:flex;flex-direction:column;position:relative;z-index:1}
.flow-col-hdr{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text3);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.sig-card{background:var(--surface);border-radius:11px;padding:11px 12px;border:1.5px solid var(--border);margin-bottom:9px;animation:pop .35s ease backwards;position:relative;transition:border-color .15s}
.sig-card:hover{border-color:var(--border2)}
.sig-del{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:5px;background:transparent;border:none;color:var(--text3);font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.sig-card:hover .sig-del{display:flex}
.sig-del:hover{background:var(--surface2);color:var(--text)}
.sig-page-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;border:1px solid;display:inline-flex;align-items:center;gap:4px;margin:3px 3px 0 0;cursor:default}
.flow-page{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:9px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .15s;animation:pop .3s ease backwards;position:relative}
.flow-page:hover{border-color:var(--border2)}
.flow-page.fp-active{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
.fp-label{font-size:13px;font-weight:600;cursor:text}
.fp-type{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px}
.flow-wire{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:9px;animation:pop .35s ease backwards;cursor:pointer;transition:border-color .15s;position:relative}
.flow-wire:hover{border-color:var(--brand)}
.flow-wire-hdr{font-size:11px;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;background:var(--surface2)}
.flow-wire-body{padding:7px 10px;display:flex;flex-direction:column;gap:3px}

/* SITEMAP */
.sm-node{position:absolute;width:118px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 8px 8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:center;user-select:none}
.sm-node:hover{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.sm-node.sm-active{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface))}

/* WIREFRAME */
.wf-wrap{display:flex;gap:20px;padding:28px 32px;align-items:flex-start;min-height:100%}
.wf-artboard{flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg,0 4px 16px rgba(28,25,20,.10))}
.wf-artboard-hdr{background:var(--surface2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:8px}
.wf-section{border-bottom:1px solid var(--border);padding:11px 16px;display:flex;align-items:center;gap:10px;transition:background .12s}
.wf-section:hover{background:color-mix(in srgb,var(--brand) 3%,transparent)}
.wf-section:last-child{border-bottom:none}
.wf-section-name{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--text2);min-width:180px;cursor:text}
.wf-section-sigs{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;max-width:300px;justify-content:flex-end}
.wf-section-sig{display:flex;align-items:center;gap:4px;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.wf-anno-panel{width:220px;flex:none;display:flex;flex-direction:column;gap:9px}
.wf-anno{background:var(--surface);border-radius:10px;padding:11px;border-left:3px solid;animation:rise .3s ease}
.wf-anno-label{font-size:9.5px;font-weight:700;letter-spacing:.05em;margin-bottom:4px;text-transform:uppercase}
.wf-anno-text{font-size:12px;color:var(--text2);line-height:1.45}

/* STYLE GUIDE */
.sg{padding:32px 40px 64px;max-width:880px}
.sg-sec{margin-bottom:40px}
.sg-title{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text3);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:14px;text-transform:uppercase}
.sg-sub{font-size:11px;font-weight:700;color:var(--text2);margin:12px 0 8px}
.sg-row{display:flex;flex-wrap:wrap;gap:10px}
.swatch{border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.06);min-width:86px}
.swatch-col{height:48px}
.swatch-info{padding:6px 8px;background:var(--surface)}
.sw-name{font-size:10px;font-weight:600}
.sw-val{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3)}
.type-row{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.type-row:last-child{border-bottom:none;margin:0}
.type-lbl{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--text3);margin-bottom:5px}

/* PREVIEW */
#prev-overlay{position:fixed;inset:0;z-index:9000;background:#f5f5f5;overflow-y:auto;display:none;font-family:'Inter',-apple-system,sans-serif}
html[data-theme="dark"] #prev-overlay{background:var(--bg)}
#prev-overlay.on{display:block}
#prev-chrome{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9001;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);border-radius:30px;padding:5px 8px 5px 16px;border:1px solid rgba(255,255,255,.1);white-space:nowrap}
.prev-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.prev-btn:hover{background:rgba(255,255,255,.22)}
.prev-page-btn{padding:5px 11px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
/* INSPECT PANE */
.insp-tabs{display:flex;border-bottom:1px solid var(--border);flex:none}
.insp-tab{flex:1;height:36px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;background:none;transition:all .14s}
.insp-tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.insp-sec{padding:12px 14px;border-bottom:1px solid var(--border)}
.insp-lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;color:var(--text3);letter-spacing:.07em;margin-bottom:8px}
.insp-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
.insp-key{font-size:11.5px;color:var(--text3)}
.insp-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);background:var(--surface2);border-radius:4px;padding:2px 6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok-bind{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:11.5px}
.tok-sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.08)}
.tok-name{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--blue)}
.src-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;cursor:pointer;transition:opacity .12s}
.src-badge:hover{opacity:.7}
.nn-nav{background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:10;display:flex;align-items:center;padding:0 48px;height:64px;gap:32px}
html[data-theme="dark"] .nn-nav{background:var(--surface);border-bottom-color:var(--border)}
.nn-logo-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);flex:none}
.nn-nav-links{display:flex;gap:28px;margin-left:8px}
.nn-nav-links a{font-size:14px;color:var(--text2);text-decoration:none}
.nn-cta{margin-left:auto;height:38px;padding:0 20px;border-radius:19px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif}
.nn-hero{background:#f5f5f5;padding:80px 48px 64px;text-align:center;display:flex;flex-direction:column;align-items:center}
html[data-theme="dark"] .nn-hero{background:var(--bg)}
.nn-badge{height:26px;padding:0 14px;border-radius:13px;border:1px solid var(--brand);background:var(--brand-light);display:inline-flex;align-items:center;margin-bottom:20px;font-size:11px;font-weight:600;color:var(--brand);letter-spacing:.04em}
.nn-h1{font-family:'Playfair Display',Georgia,serif;font-size:52px;font-weight:700;color:var(--text);line-height:1.1;letter-spacing:-.025em;max-width:680px;margin:0 0 18px}
.nn-lead{font-size:16px;color:var(--text2);line-height:1.65;max-width:510px;margin:0 0 28px}
.nn-btns{display:flex;gap:12px}
.nn-btn1{height:48px;padding:0 28px;border-radius:24px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif}
.nn-btn2{height:48px;padding:0 24px;border-radius:24px;border:1.5px solid #c8c8c8;background:transparent;color:var(--text2);font-size:14px;font-family:'Inter',sans-serif}
html[data-theme="dark"] .nn-btn2{border-color:var(--border2)}
.nn-stats{background:#eee;display:flex;align-items:center;justify-content:center;border-top:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0}
html[data-theme="dark"] .nn-stats{background:var(--surface2);border-color:var(--border)}
.nn-stat{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;padding:28px 16px;gap:4px}
.nn-stat-val{font-family:'Playfair Display',Georgia,serif;font-size:36px;font-weight:700;color:var(--brand);line-height:1}
.nn-stat-lbl{font-size:11px;color:var(--text3);letter-spacing:.06em}
.nn-stat-div{width:1px;height:40px;background:#d8d8d8;align-self:center}
html[data-theme="dark"] .nn-stat-div{background:var(--border)}
.nn-feat{padding:64px 48px;background:#f0f0f0}
html[data-theme="dark"] .nn-feat{background:var(--surface2)}
.nn-eyebrow{display:inline-block;padding:4px 12px;border-radius:12px;background:var(--brand-light);color:var(--brand);font-size:10.5px;font-weight:600;margin-bottom:10px;letter-spacing:.05em}
.nn-h2{font-family:'Playfair Display',Georgia,serif;font-size:34px;font-weight:700;color:var(--text);letter-spacing:-.02em;margin:0 0 10px}
.nn-feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:860px;margin:0 auto}
.nn-feat-card{background:#fff;border:1px solid #e4e4e4;border-radius:13px;padding:22px}
html[data-theme="dark"] .nn-feat-card{background:var(--surface);border-color:var(--border)}
.nn-feat-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.nn-feat-card h3{font-size:14px;font-weight:700;color:var(--text);margin:0 0 6px}
.nn-feat-card p{font-size:12.5px;color:var(--text2);line-height:1.55;margin:0}
.nn-footer{background:#1a1714;padding:36px 48px;display:flex;align-items:center;justify-content:space-between}
html[data-theme="dark"] .nn-footer{background:#080706}
.nn-footer-logo{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#e8e3de}
.nn-flinks{display:flex;gap:18px}
.nn-flinks a{font-size:12px;color:#706860;text-decoration:none}
/* ADDITIONAL PREVIEW PAGE STYLES */
.nn-page-hero{background:#f5f5f5;padding:80px 48px 64px;text-align:center;display:flex;flex-direction:column;align-items:center}
html[data-theme="dark"] .nn-page-hero{background:var(--bg)}
.nn-section{padding:72px 48px;background:#f0f0f0}
html[data-theme="dark"] .nn-section{background:var(--surface2)}
.nn-section-alt{padding:72px 48px;background:#f5f5f5}
html[data-theme="dark"] .nn-section-alt{background:var(--bg)}
.nn-team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:860px;margin:0 auto}
.nn-team-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.nn-team-avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;flex:none}
.nn-values-list{display:flex;flex-direction:column;gap:20px;max-width:640px;margin:0 auto}
.nn-value-item{display:flex;gap:16px;align-items:flex-start}
.nn-value-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.nn-article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:960px;margin:0 auto}
.nn-article-card{background:#fff;border:1px solid #e4e4e4;border-radius:13px;overflow:hidden}
html[data-theme="dark"] .nn-article-card{background:var(--surface);border-color:var(--border)}
.nn-article-img{height:160px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:32px}
html[data-theme="dark"] .nn-article-img{background:var(--surface2)}
.nn-article-body{padding:18px}
.nn-contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;max-width:860px;margin:0 auto}
.nn-form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.nn-form-label{font-size:13px;font-weight:600;color:var(--text)}
.nn-form-input{height:44px;border:1.5px solid #d8d8d8;border-radius:8px;padding:0 14px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);background:#fff;transition:border .15s}
html[data-theme="dark"] .nn-form-input{background:var(--surface);border-color:var(--border);color:var(--text)}
.nn-form-input:focus{border-color:var(--brand);outline:none}
.nn-form-textarea{border:1.5px solid #d8d8d8;border-radius:8px;padding:12px 14px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);background:#fff;resize:vertical;min-height:120px;transition:border .15s}
html[data-theme="dark"] .nn-form-textarea{background:var(--surface);border-color:var(--border);color:var(--text)}
.nn-form-textarea:focus{border-color:var(--brand);outline:none}
.nn-price-grid{display:flex;gap:20px;justify-content:center;max-width:860px;margin:0 auto;flex-wrap:wrap}
.nn-price-card-v2{background:#fff;border:1.5px solid #e4e4e4;border-radius:16px;padding:28px;flex:1;min-width:220px;max-width:270px;display:flex;flex-direction:column;gap:0}
html[data-theme="dark"] .nn-price-card-v2{background:var(--surface);border-color:var(--border)}
.nn-price-card-v2.featured{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),0 0 20px color-mix(in srgb,var(--brand) 20%,transparent)}
.nn-price-feat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);padding:6px 0;border-bottom:1px solid #f0f0f0}
html[data-theme="dark"] .nn-price-feat{border-bottom-color:var(--border)}
.nn-faq-item{padding:16px 0;border-bottom:1px solid #e8e8e8}
html[data-theme="dark"] .nn-faq-item{border-bottom-color:var(--border)}
.nn-integ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:720px;margin:24px auto 0}
.nn-integ-card{background:#fff;border:1px solid #e4e4e4;border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
html[data-theme="dark"] .nn-integ-card{background:var(--surface);border-color:var(--border)}
</style>
</head>
<body>
<div id="app">
  <header id="toolbar"></header>
  <div id="body">
    <aside class="left-rail" id="left-rail"></aside>
    <div class="stage" id="stage"></div>
    <aside class="right-rail" id="right-rail"></aside>
  </div>
</div>

<div id="prev-overlay">
  <div id="prev-chrome"></div>
  <div id="prev-body"></div>
</div>

<script>
// ── TOKENS ────────────────────────────────────────────────────────────────────
function T(){
  const cs=getComputedStyle(document.documentElement),v=k=>cs.getPropertyValue(k).trim();
  return{
    brand:v('--brand')||'#D96000',brandLight:v('--brand-light')||'#FFF0E0',
    brandMid:v('--brand-mid')||'#EE7A00',
    surface:v('--surface')||'#FDFAF5',surfaceWarm:v('--surface-warm')||'#FFFDF8',
    surface2:v('--surface2')||'#EEE9E2',
    border:v('--border')||'#DAD5CC',border2:v('--border2')||'#C4BCAF',
    text:v('--text')||'#1C1914',text2:v('--text2')||'#6B6860',text3:v('--text3')||'#9C9890',
    teal:v('--teal')||'#1f9d8f',purple:v('--purple')||'#6f57d4',
    blue:v('--blue')||'#2f5bea',amber:v('--amber')||'#c2700f',
    red:v('--red')||'#d4456b',green:v('--green')||'#2e8157',
    greenLight:v('--green-light')||'#e6f3ec',amberLight:v('--amber-light')||'#faeeda',
  };
}
function isDark(){return document.documentElement.getAttribute('data-theme')==='dark';}

// ── STATE ─────────────────────────────────────────────────────────────────────
let S={
  mode:'flow',
  page:'home',
  rtab:'agents',
  chat:[],
  typing:false,
  chatFor:null,
  designSelected:null,
  inspTab:'inspect',
  signals:[
    {id:'s1',text:'Visitors leave before first value prop — 72% bounce on mobile',color:'#1f9d8f',pages:['home','pricing'],source:'Analytics',impact:'Critical',
     confluence:'NN-Research-Sprint-3 · Bounce Analysis',miro:'User Flow Audit Board'},
    {id:'s2',text:'Two personas: technical evaluators want benchmarks, business buyers want logos',color:'#6f57d4',pages:['home','product'],source:'User Interviews',impact:'High',
     confluence:'NN-Persona-Research · Dual Track',miro:'Persona Journey Map'},
    {id:'s3',text:'Social proof visible before scroll drives 2.3× lift in trial sign-ups',color:'#2f5bea',pages:['home'],source:'A/B Testing',impact:'High',
     confluence:'NN-CRO-Experiments · Social Proof',miro:'Conversion Flow Map'},
    {id:'s4',text:'CTA form has 7 fields — 3-field version converts at 4% vs 1.8%',color:'#c2700f',pages:['pricing','contact'],source:'Conversion Audit',impact:'Critical',
     confluence:'NN-CRO-Experiments · Form Optimization',miro:'Conversion Flow Map'},
    {id:'s5',text:'"Intelligent infrastructure" understood by only 38% of first-time visitors',color:'#d4456b',pages:['home','product'],source:'User Survey',impact:'High',
     confluence:'NN-Research-Sprint-3 · Message Testing',miro:'Messaging Workshop Board'},
  ],
  pages:[
    {id:'home',  label:'Home',    type:'Landing',icon:'🏠'},
    {id:'about', label:'About',   type:'Content',icon:'👥'},
    {id:'product',label:'Product',type:'App',    icon:'🔧'},
    {id:'pricing',label:'Pricing',type:'Landing',icon:'💰'},
    {id:'blog',  label:'Blog',    type:'Index',  icon:'📝'},
    {id:'contact',label:'Contact',type:'Form',   icon:'📬'},
  ],
  sections:{
    home:   ['NAV','HERO — value prop','STATS — social proof','FEATURES — 3-col grid','PRICING TEASER','FOOTER'],
    about:  ['NAV','MISSION — two paragraphs','TEAM — photo grid','VALUES','FOOTER'],
    product:['NAV','HERO — product demo','FEATURES — detail view','INTEGRATIONS','FOOTER'],
    pricing:['NAV','HERO — 3-field CTA','PLAN CARDS — 3 tiers','FAQ — 5 items','FOOTER'],
    blog:   ['NAV','HERO — filter bar','ARTICLE GRID','PAGINATION','FOOTER'],
    contact:['NAV','FORM — 3 fields','OFFICE LOCATIONS','FOOTER'],
  },
  sectionSigs:{
    'home:HERO — value prop':['s5','s2'],
    'home:STATS — social proof':['s3'],
    'home:FEATURES — 3-col grid':['s2'],
    'home:PRICING TEASER':['s1','s4'],
    'product:HERO — product demo':['s2','s5'],
    'pricing:HERO — 3-field CTA':['s4','s1'],
    'pricing:PLAN CARDS — 3 tiers':['s4'],
    'contact:FORM — 3 fields':['s4'],
  },
};

function setState(u){Object.assign(S,typeof u==='function'?u(S):u);render();}

// ── AGENTS ────────────────────────────────────────────────────────────────────
const AGENTS=[
  {key:'research',name:'Research Agent', short:'RE',color:'#1f9d8f',status:'Done',
   contrib:['Synthesized 5 inputs into research brief','Flagged 72% mobile bounce rate','Identified two distinct persona types']},
  {key:'strategy',name:'Strategy Agent', short:'ST',color:'#c2700f',status:'Done',
   contrib:['Defined dual-track hero strategy','Mapped social proof to above-fold','Recommended 3-field CTA']},
  {key:'wireframe',name:'Wireframe Agent',short:'WF',color:'#6f57d4',status:'Done',
   contrib:['Generated 3 wireframe directions','Structured sitemap into 6 pages','Defined section hierarchy']},
  {key:'visual',  name:'Visual Agent',  short:'VD',color:'#d4456b',status:'Active',
   contrib:['Applied Neura Nova brand tokens','Hi-fi design live in Design mode']},
];

const CHAT_REPLIES=[
  "The 72% bounce rate is the most critical signal — whatever structure we use, the value prop has to land in the first 100px on mobile.",
  "Two distinct audiences need two distinct hero paths. Technical evaluators need benchmark numbers; business buyers need recognizable logos.",
  "Social proof before the CTA isn't optional — it's what drove the 2.3× lift in comparable products. That section position is load-bearing.",
  "Pricing page CTA simplification is the highest-leverage change. 7 fields → 3 fields based directly on the conversion research.",
  "The 'Intelligent infrastructure' headline problem is what makes the HERO section the top priority on both Home and Product pages.",
  "The sitemap structure is a direct output of the research: Home handles the persona split, Product goes deep for technical users, Pricing is pure conversion.",
];

// ── FLOW MODE ─────────────────────────────────────────────────────────────────
function buildPageSigMap(){
  const m={};
  S.pages.forEach(p=>{m[p.id]=[];});
  S.signals.forEach(sig=>{sig.pages.forEach(pid=>{if(m[pid])m[pid].push(sig);});});
  return m;
}

function renderFlow(){
  const tok=T();
  const psm=buildPageSigMap();
  const CW1=252,GAP=72,CW2=168,CW3=196;

  const impactBg={Critical:'#fde8ee',High:'#faeeda',Medium:'#e6f3ec'};
  const impactClr={Critical:'#d4456b',High:'#c2700f',Medium:'#2e8157'};
  const srcIcon={'Analytics':'📊','User Interviews':'👥','A/B Testing':'⚗️','Conversion Audit':'🔍','User Survey':'📋'};
  const sigCards=S.signals.map((sig,i)=>`
    <div class="sig-card" data-sig="${sig.id}" style="animation-delay:${i*.05}s">
      <button class="sig-del" onclick="event.stopPropagation();deleteSig('${sig.id}')">×</button>
      <div style="display:flex;gap:9px;align-items:flex-start">
        <div style="width:3px;border-radius:2px;background:${sig.color};align-self:stretch;flex:none;min-height:20px"></div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap">
            <span style="font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:${impactBg[sig.impact]||impactBg.Medium};color:${impactClr[sig.impact]||impactClr.Medium};letter-spacing:.04em">${(sig.impact||'Medium').toUpperCase()}</span>
            <span style="font-size:10px;color:var(--text3)">${srcIcon[sig.source]||'📊'} ${sig.source||'Analytics'}</span>
          </div>
          <div contenteditable="true" spellcheck="false"
            onblur="saveSig('${sig.id}',this.innerText)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
            style="font-size:12.5px;line-height:1.5;cursor:text">${sig.text}</div>
          <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px">
            ${sig.pages.map(pid=>{const pg=S.pages.find(p=>p.id===pid);return pg?`<span class="sig-page-tag" style="color:${sig.color};border-color:${sig.color}22;background:${sig.color}0f">${pg.icon} ${pg.label}</span>`:''}).join('')}
          </div>
          <div style="display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap">
            <span style="font-size:9.5px;color:var(--text3)">Research Agent</span>
            ${sig.confluence?`<span class="src-badge" style="background:#e7eefe;color:#2f5bea" title="${sig.confluence}">📄 Confluence</span>`:''}
            ${sig.miro?`<span class="src-badge" style="background:#e0f3f1;color:#1f9d8f" title="${sig.miro}">◫ Miro</span>`:''}
          </div>
        </div>
        <div data-dot="${sig.id}-out" style="width:9px;height:9px;border-radius:50%;background:${sig.color};flex:none;margin-top:4px;box-shadow:0 0 0 2px ${tok.surface},0 0 0 3.5px ${sig.color}55"></div>
      </div>
    </div>
  `).join('');

  const pageNodes=S.pages.map((pg,i)=>{
    const sids=(psm[pg.id]||[]);
    return`<div class="flow-page${S.page===pg.id?' fp-active':''}" style="animation-delay:${i*.04}s" onclick="setState({page:'${pg.id}'})">
      <div data-dot="${pg.id}-in" style="width:9px;height:9px;border-radius:50%;background:${tok.border2};flex:none;box-shadow:0 0 0 2px ${tok.surface},0 0 0 3.5px ${tok.border2}55"></div>
      <span style="font-size:14px;flex:none">${pg.icon}</span>
      <div style="flex:1;min-width:0">
        <div class="fp-label" contenteditable="true" spellcheck="false"
          onblur="savePage('${pg.id}',this.innerText)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          onclick="event.stopPropagation()">${pg.label}</div>
        <div class="fp-type">${pg.type}</div>
        <div style="display:flex;gap:3px;margin-top:4px">${sids.map(s=>`<div style="width:6px;height:6px;border-radius:50%;background:${s.color}" title="${s.text}"></div>`).join('')}</div>
      </div>
      <div data-dot="${pg.id}-out" style="width:9px;height:9px;border-radius:50%;background:${tok.border2};flex:none;box-shadow:0 0 0 2px ${tok.surface},0 0 0 3.5px ${tok.border2}55"></div>
    </div>`;
  }).join('');

  const wireFrames=S.pages.map((pg,i)=>{
    const sids=psm[pg.id]||[];
    const secs=(S.sections[pg.id]||[]).slice(0,4);
    const barW=[100,78,60,85];
    return`<div class="flow-wire" style="animation-delay:${i*.05}s" onclick="setState({page:'${pg.id}',mode:'wireframe'})">
      <div data-dot="${pg.id}-wire" style="position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:${tok.border2};box-shadow:0 0 0 2px ${tok.surface2},0 0 0 3.5px ${tok.border2}55"></div>
      <div class="flow-wire-hdr">
        <span>${pg.icon}</span>
        <span>${pg.label}</span>
        ${sids.map(s=>`<div style="width:5px;height:5px;border-radius:50%;background:${s.color};flex:none"></div>`).join('')}
      </div>
      <div class="flow-wire-body">
        ${secs.map((sec,j)=>{
          const key=`${pg.id}:${sec}`;
          const ssigs=(S.sectionSigs[key]||[]).map(sid=>S.signals.find(x=>x.id===sid)).filter(Boolean);
          return`<div style="display:flex;align-items:center;gap:5px">
            <div style="flex:1;height:5px;background:${tok.surface2};border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${barW[j%4]}%;background:${ssigs[0]?ssigs[0].color+'44':tok.border};border-radius:2px"></div>
            </div>
            ${ssigs.slice(0,2).map(s=>`<div style="width:5px;height:5px;border-radius:50%;background:${s.color};flex:none"></div>`).join('')}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  const total=CW1+GAP+CW2+GAP+CW3+80;
  document.getElementById('stage').innerHTML=`
    <div class="flow-wrap" id="flow-wrap" style="min-width:${total}px">
      <svg class="flow-svg" id="flow-svg"></svg>

      <div class="flow-col" style="width:${CW1}px;flex:none">
        <div class="flow-col-hdr" style="flex-direction:column;align-items:flex-start;gap:5px">
          <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
            <span>RESEARCH SIGNALS</span>
            <span style="color:var(--text3)">${S.signals.length}</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${['📊 Analytics','👥 Interviews','⚗️ A/B Testing','🔍 Audit','📋 Survey'].map(src=>`<span style="font-size:9px;padding:1px 5px;border-radius:4px;background:var(--surface2);color:var(--text3)">${src}</span>`).join('')}
          </div>
        </div>
        ${sigCards}
        <button class="rail-add" onclick="addSig()">+ Add signal</button>
      </div>

      <div style="width:${GAP}px;flex:none;position:relative;z-index:0"></div>

      <div class="flow-col" style="width:${CW2}px;flex:none">
        <div class="flow-col-hdr">
          <span>SITEMAP</span>
          <span style="color:var(--text3)">${S.pages.length} pages</span>
        </div>
        ${pageNodes}
        <button class="rail-add" onclick="addPage()">+ Add page</button>
      </div>

      <div style="width:${GAP}px;flex:none;position:relative;z-index:0"></div>

      <div class="flow-col" style="width:${CW3}px;flex:none">
        <div class="flow-col-hdr">
          <span>WIREFRAMES</span>
          <button onclick="setState({mode:'wireframe'})" style="font-size:10px;color:var(--brand);background:none;border:none;cursor:pointer;font-weight:600;font-family:'Inter',sans-serif;padding:0">Open →</button>
        </div>
        ${wireFrames}
      </div>
    </div>`;

  requestAnimationFrame(drawFlowLines);
}

function drawFlowLines(){
  const svg=document.getElementById('flow-svg');
  const wrap=document.getElementById('flow-wrap');
  const stage=document.getElementById('stage');
  if(!svg||!wrap)return;
  const wr=wrap.getBoundingClientRect();
  const scrollTop=stage.scrollTop;
  const h=wrap.scrollHeight;
  svg.setAttribute('width',wr.width);
  svg.setAttribute('height',h);
  svg.setAttribute('viewBox',`0 0 ${wr.width} ${h}`);
  svg.style.width=wr.width+'px';
  svg.style.height=h+'px';

  let paths='';

  // Signal → Page lines
  S.signals.forEach(sig=>{
    const fromEl=document.querySelector(`[data-dot="${sig.id}-out"]`);
    if(!fromEl)return;
    const fr=fromEl.getBoundingClientRect();
    const x1=fr.right-wr.left;
    const y1=(fr.top+fr.bottom)/2-wr.top+scrollTop;
    sig.pages.forEach(pid=>{
      const toEl=document.querySelector(`[data-dot="${pid}-in"]`);
      if(!toEl)return;
      const tr=toEl.getBoundingClientRect();
      const x2=tr.left-wr.left;
      const y2=(tr.top+tr.bottom)/2-wr.top+scrollTop;
      const cx=(x1+x2)/2;
      paths+=`<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}" stroke="${sig.color}" stroke-width="1.5" fill="none" opacity="0.5"/>`;
      paths+=`<circle cx="${x1}" cy="${y1}" r="2.5" fill="${sig.color}"/>`;
      paths+=`<circle cx="${x2}" cy="${y2}" r="2.5" fill="${sig.color}"/>`;
    });
  });

  // Page → Wireframe lines
  const tok=T();
  S.pages.forEach(pg=>{
    const fromEl=document.querySelector(`[data-dot="${pg.id}-out"]`);
    const toEl=document.querySelector(`[data-dot="${pg.id}-wire"]`);
    if(!fromEl||!toEl)return;
    const fr=fromEl.getBoundingClientRect();
    const tr=toEl.getBoundingClientRect();
    const x1=fr.right-wr.left;
    const y1=(fr.top+fr.bottom)/2-wr.top+scrollTop;
    const x2=tr.left-wr.left+16;
    const y2=(tr.top+tr.bottom)/2-wr.top+scrollTop;
    const cx=(x1+x2)/2;
    paths+=`<path d="M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}" stroke="${tok.border2}" stroke-width="1.5" fill="none" opacity="0.6"/>`;
  });

  svg.innerHTML=paths;
}

// ── SITEMAP MODE ──────────────────────────────────────────────────────────────
const SM_TREE=[
  {id:'home',x:491,y:28,parent:null},
  {id:'about',x:50,y:148,parent:'home'},
  {id:'product',x:222,y:148,parent:'home'},
  {id:'pricing',x:432,y:148,parent:'home'},
  {id:'blog',x:622,y:148,parent:'home'},
  {id:'contact',x:822,y:148,parent:'home'},
  {id:'team',x:30,y:278,parent:'about'},
  {id:'mission',x:162,y:278,parent:'about'},
  {id:'features',x:182,y:278,parent:'product'},
  {id:'integrations',x:314,y:278,parent:'product'},
  {id:'post',x:602,y:278,parent:'blog'},
];
const NW=118,NH=60;

function renderSitemap(){
  const tok=T();
  const psm=buildPageSigMap();
  const lines=SM_TREE.filter(n=>n.parent).map(n=>{
    const from=SM_TREE.find(x=>x.id===n.parent);if(!from)return'';
    const x1=from.x+NW/2,y1=from.y+NH,x2=n.x+NW/2,y2=n.y,my=(y1+y2)/2;
    return`<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="${tok.border2}" stroke-width="1.5" ${n.y===278?'stroke-dasharray="5 3"':''}/>`;
  }).join('');

  const nodes=SM_TREE.map(n=>{
    const pg=S.pages.find(p=>p.id===n.id)||{id:n.id,label:n.id,type:'',icon:'📄'};
    const sigs=psm[n.id]||[];
    const active=n.id===S.page;
    // collect unique source docs for this node
    const confDocs=[...new Set(sigs.filter(s=>s.confluence).map(s=>s.confluence))];
    const miroDocs=[...new Set(sigs.filter(s=>s.miro).map(s=>s.miro))];
    return`<div class="sm-node${active?' sm-active':''}" style="left:${n.x}px;top:${n.y}px;width:${NW}px" onclick="setState({page:'${n.id}'})">
      <div style="font-size:14px;margin-bottom:2px">${pg.icon}</div>
      <div style="font-size:11px;font-weight:600;color:var(--text)">${pg.label}</div>
      <div style="font-size:9px;color:var(--text3);margin-top:1px;font-family:'JetBrains Mono',monospace">${pg.type}</div>
      <div style="display:flex;justify-content:center;gap:3px;margin-top:5px;flex-wrap:wrap">
        ${sigs.map(s=>`<div style="width:6px;height:6px;border-radius:50%;background:${s.color}" title="${s.text}"></div>`).join('')}
      </div>
      ${confDocs.length||miroDocs.length?`<div style="display:flex;justify-content:center;gap:3px;margin-top:4px;flex-wrap:wrap">
        ${confDocs.slice(0,1).map(()=>`<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#e7eefe;color:#2f5bea;font-weight:600">📄 Confluence</span>`).join('')}
        ${miroDocs.slice(0,1).map(()=>`<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#e0f3f1;color:#1f9d8f;font-weight:600">◫ Miro</span>`).join('')}
      </div>`:''}
    </div>`;
  }).join('');

  const legend=S.signals.map(s=>`<div style="display:flex;align-items:center;gap:5px"><div style="width:8px;height:8px;border-radius:50%;background:${s.color};flex:none"></div><span style="font-size:10px;color:var(--text2);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.text.split('—')[0].trim()}</span></div>`).join('');

  document.getElementById('stage').innerHTML=`
    <div style="padding:20px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap">

// ── WIREFRAME MODE ────────────────────────────────────────────────────────────
function renderWireframe(){
  const tok=T();
  const pg=S.pages.find(p=>p.id===S.page)||S.pages[0];
  const secs=S.sections[S.page]||[];
  const psm=buildPageSigMap();

  const sectionRows=secs.map((sec,i)=>{
    const key=`${S.page}:${sec}`;
    const ssigs=(S.sectionSigs[key]||[]).map(sid=>S.signals.find(x=>x.id===sid)).filter(Boolean);
    const sigDots=ssigs.map(s=>`<div style="width:6px;height:6px;border-radius:50%;background:${s.color};flex:none" title="${s.text}"></div>`).join('');
    return`<div style="border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px;padding:6px 14px 0;background:var(--surface2)">
        <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.05em;color:var(--text3);flex:1" contenteditable="true" spellcheck="false"
          onblur="saveSection('${S.page}',${i},this.innerText)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${sec}</div>
        <div style="display:flex;gap:3px;align-items:center">${sigDots}</div>
        <button onclick="deleteSection('${S.page}',${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;opacity:.5;transition:opacity .1s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.5">×</button>
      </div>
      ${wfBlock(sec)}
    </div>`;
  }).join('');

  // annotation sidebar: signals that apply to this page
  const pageSigIds=new Set();
  secs.forEach(sec=>{(S.sectionSigs[`${S.page}:${sec}`]||[]).forEach(sid=>pageSigIds.add(sid));});
  const annos=[...pageSigIds].map(sid=>{
    const s=S.signals.find(x=>x.id===sid);if(!s)return'';
    return`<div class="wf-anno" style="border-left-color:${s.color}">
      <div class="wf-anno-label" style="color:${s.color}">Research Signal</div>
      <div class="wf-anno-text">${s.text}</div>
    </div>`;
  }).join('');

  document.getElementById('stage').innerHTML=`<div class="wf-wrap">
    <div style="flex:1;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex:none">
        <span style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em">WIREFRAME</span>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          ${S.pages.map(p=>`<button onclick="setState({page:'${p.id}'})" style="padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:600;background:${S.page===p.id?'var(--brand)':'transparent'};color:${S.page===p.id?'#fff':'var(--text2)'};border:1px solid ${S.page===p.id?'var(--brand)':'var(--border)'};cursor:pointer;font-family:'Inter',sans-serif;transition:all .12s">${p.label}</button>`).join('')}
        </div>
      </div>
      <div class="wf-artboard">
        <div class="wf-artboard-hdr">
          <span style="font-size:13px;font-weight:700">${pg.icon} ${pg.label}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);margin-left:auto">${pg.type}</span>
        </div>
        ${sectionRows}
        <div style="padding:10px 16px">
          <button onclick="addSection('${S.page}')" style="font-size:11.5px;color:var(--text3);background:none;border:1px dashed var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;width:100%;font-family:'Inter',sans-serif">+ Add section</button>
        </div>
      </div>
    </div>
    ${annos?`<div class="wf-anno-panel"><div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;margin-bottom:10px">RESEARCH CONTEXT</div>${annos}</div>`:''}
  </div>`;
}

function addSig(){
  const pallete=[T().teal,T().purple,T().blue,T().amber,T().red,T().green];
  const color=pallete[S.signals.length%pallete.length];
  const id='s'+(Date.now()%100000);
  setState({signals:[...S.signals,{id,text:'New signal — click to edit',color,pages:[],source:'Analytics',impact:'Medium'}]});
  requestAnimationFrame(()=>{
    const el=document.querySelector(`[data-sig="${id}"] [contenteditable]`);
    if(el){el.focus();document.execCommand('selectAll');}
  });
}
function deleteSig(id){setState({signals:S.signals.filter(s=>s.id!==id)});}
function saveSig(id,text){setState({signals:S.signals.map(s=>s.id===id?{...s,text:text.trim()||s.text}:s)});}
function addPage(){
  const id='p'+(Date.now()%10000);
  setState({
    pages:[...S.pages,{id,label:'New Page',type:'Content',icon:'📄'}],
    sections:{...S.sections,[id]:['NAV','SECTION 1','SECTION 2','FOOTER']},
  });
}
function savePage(id,label){setState({pages:S.pages.map(p=>p.id===id?{...p,label:label.trim()||p.label}:p)});}
function saveSection(pageId,idx,text){
  const secs=[...(S.sections[pageId]||[])];
  secs[idx]=text.trim()||secs[idx];
  setState({sections:{...S.sections,[pageId]:secs}});
}
function addSection(pageId){
  const secs=[...(S.sections[pageId]||[])];
  secs.splice(secs.length-1,0,'NEW SECTION — click to rename');
  setState({sections:{...S.sections,[pageId]:secs}});
}
function deleteSection(pageId,idx){
  const secs=[...(S.sections[pageId]||[])];
  secs.splice(idx,1);
  setState({sections:{...S.sections,[pageId]:secs}});
}
function sendChat(){
  const inp=document.getElementById('chat-input');
  if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  inp.value='';
  const chat=[...S.chat,{role:'user',text}];
  setState({chat,typing:true});
  setTimeout(()=>{
    const idx=(text.length*3+S.chat.length*7)%CHAT_REPLIES.length;
    setState({chat:[...S.chat,{role:'ai',text:CHAT_REPLIES[idx]}],typing:false});
  },1100);
}
function toggleTheme(){document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');render();}

function togglePrevTheme(){toggleTheme();renderPrevChrome();document.getElementById('prev-body').innerHTML=buildPageHtml(prevPage);}

function renderPrevChrome(){
  const tabs=PREV_PAGES.map(p=>`<button class="prev-page-btn" data-page="${p.id}" onclick="switchPrevPage('${p.id}')"
    style="background:${prevPage===p.id?'rgba(255,255,255,.2)':'transparent'};color:${prevPage===p.id?'#fff':'rgba(255,255,255,.5)'}">${p.label}</button>`).join('');
  document.getElementById('prev-chrome').innerHTML=`
    <div style="display:flex;gap:2px">${tabs}</div>
    <div style="width:1px;height:16px;background:rgba(255,255,255,.15);flex:none"></div>
    <button class="prev-btn" onclick="togglePrevTheme()">◑ Theme</button>
    <button class="prev-btn" onclick="closePreview()">✕ Exit</button>`;
}

function switchPrevPage(pid){
  prevPage=pid;
  document.getElementById('prev-body').innerHTML=buildPageHtml(pid);
  document.querySelectorAll('.prev-page-btn').forEach(b=>{
    const on=b.dataset.page===pid;
    b.style.background=on?'rgba(255,255,255,.2)':'transparent';
    b.style.color=on?'#fff':'rgba(255,255,255,.5)';
  });
}

function render(){
  renderToolbar();renderLeft();renderRight();
  const m=S.mode;
  if(m==='flow')renderFlow();
  else if(m==='sitemap')renderSitemap();
  else if(m==='wireframe')renderWireframe();
  else if(m==='design')renderDesign();
  else renderStyleGuide();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('prev-overlay').classList.contains('on'))closePreview();
});
render();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chorus — Axiom · Test Request Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;font-size:14px;color:var(--text);background:var(--bg-canvas)}
button{font-family:'Hanken Grotesk',sans-serif;border:none;cursor:pointer}
@keyframes ch-rise{from{transform:translateY(9px);opacity:0}to{transform:none;opacity:1}}
@keyframes ch-pop{0%{transform:translateY(12px) scale(.975);opacity:0}60%{transform:translateY(-2px) scale(1.008)}100%{transform:none;opacity:1}}
@keyframes ch-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes ch-flow{from{background-position:0 0}to{background-position:24px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2,#cfcabd);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:13px;flex:none;z-index:10}
#body{flex:1;min-height:0;position:relative;display:flex}
#canvas-view{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
#workspace-view{flex:1;min-height:0;overflow:hidden;display:flex}

.pipeline-rail{width:264px;flex:none;background:var(--surface2);border-right:1px solid var(--border);padding:22px 18px;display:flex;flex-direction:column;overflow-y:auto}
.stage{flex:1;padding:28px 36px;overflow-y:auto;display:flex;flex-direction:column}
.feed-rail{width:300px;flex:none;background:var(--surface2);border-left:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;overflow-y:auto}

.canvas-board{flex:1;overflow-x:auto;overflow-y:hidden;padding:16px 20px 20px;display:flex;gap:14px;align-items:flex-start}
.canvas-col{flex:1;min-width:284px;background:var(--surface2);border-radius:13px;border:1px solid var(--border);display:flex;flex-direction:column;max-height:calc(100vh - 158px)}
.canvas-col-header{padding:14px 16px 12px;display:flex;align-items:center;gap:8px;flex:none}
.canvas-col-body{padding:10px 12px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.canvas-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;cursor:pointer;box-shadow:var(--shadow-sm);animation:ch-rise .4s ease;transition:box-shadow .15s,transform .15s}
.canvas-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.dir-card{background:var(--surface-warm);border:2px solid var(--border);border-radius:13px;padding:15px;cursor:pointer;transition:border-color .2s,opacity .2s;flex:1;min-width:210px}
.dir-card:hover{box-shadow:0 3px 12px rgba(20,18,12,.09)}
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;animation:ch-rise .35s ease;margin-bottom:9px}
.tag-chip{display:inline-flex;align-items:center;border-radius:5px;padding:3px 7px;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;margin-top:7px}
.prov-step{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)}
.prov-step:last-child{border-bottom:none}

/* Director panel */
.dir-panel{margin-bottom:10px;border-radius:9px;border:1px solid var(--border2);overflow:hidden;background:var(--surface)}
.dir-panel-header{padding:9px 11px;font-size:11px;font-weight:600;color:var(--text2);background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.dir-textarea{width:100%;padding:9px 11px;border:none;background:var(--surface);color:var(--text);font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;line-height:1.5;resize:vertical;min-height:62px;outline:none;display:block}
.dir-footer{padding:7px 10px;background:var(--surface2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.dir-hint{font-size:10px;color:var(--text3)}

/* Reference cards */
.ref-row{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);overflow-x:auto}
.ref-card{flex:none;width:148px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.ref-card:hover{box-shadow:var(--shadow-md)}
.ref-thumb{height:76px;overflow:hidden}
.ref-meta{padding:7px 9px}
.ref-source{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.5px}
.ref-label{font-size:11.5px;font-weight:600;margin-top:2px;line-height:1.3}

/* Editable content */
[contenteditable="true"]{outline:1.5px dashed var(--border2);border-radius:4px;padding:2px 4px;transition:outline .15s}
[contenteditable="true"]:focus{outline:2px solid var(--brand);background:var(--surface-warm)}
.edit-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;font-family:'Hanken Grotesk',sans-serif}
.edit-btn:hover{background:var(--surface2);color:var(--text)}
.edit-btn.saving{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <div id="body">
    <div id="canvas-view"></div>
    <div id="workspace-view" style="display:none"></div>
  </div>
</div>
<div id="drawer-root"></div>

<script>
// ─── TOKENS ──────────────────────────────────────────────────────────────────

function readTokens() {
  const s = getComputedStyle(document.documentElement);
  const get = v => s.getPropertyValue(v).trim();
  return {
    bgCanvas:    get('--bg-canvas')    || '#ecebe5',
    surface:     get('--surface')      || '#FDFAF6',
    surfaceWarm: get('--surface-warm') || '#fffdf8',
    surface2:    get('--surface2')     || '#E8E3D9',
    border:      get('--border')       || '#D8D2C6',
    border2:     get('--border2')      || '#C4BCAF',
    text:        get('--text')         || '#1C1914',
    text2:       get('--text2')        || '#6B6860',
    text3:       get('--text3')        || '#9C9890',
    brand:       get('--brand')        || '#1E1C18',
    brandLight:  get('--brand-light')  || '#EDEAE4',
    brandMid:    get('--brand-mid')    || '#9B8E83',
    stone:       get('--stone')        || '#7A6A5C',
    stoneLight:  get('--stone-light')  || '#F2EDE7',
    stoneMid:    get('--stone-mid')    || '#C4B5A8',
    blue:        get('--blue')         || '#2f5bea',
    blueLight:   get('--blue-light')   || '#e7eefe',
    green:       get('--green')        || '#2e8157',
    greenLight:  get('--green-light')  || '#e6f3ec',
    purple:      get('--purple')       || '#6f57d4',
    purpleLight: get('--purple-light') || '#efebfb',
    teal:        get('--teal')         || '#1f9d8f',
    amber:       get('--amber')        || '#c2700f',
    amberLight:  get('--amber-light')  || '#faeeda',
    red:         get('--red')          || '#d4456b',
    shadowSm:    get('--shadow-sm')    || '0 1px 2px rgba(28,25,20,.06)',
    shadowMd:    get('--shadow-md')    || '0 2px 8px rgba(28,25,20,.08)',
    shadowLg:    get('--shadow-lg')    || '0 4px 16px rgba(28,25,20,.10)',
  };
}

let TOKENS = readTokens();

function isDark() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr === 'dark') return true;
  if (attr === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function toggleTheme() {
  document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark');
  TOKENS = readTokens();
  render();
}

// ─── DATA ────────────────────────────────────────────────────────────────────

const AGENTS = [
  { key:'research',  name:'Research Agent',       short:'RE', color:'#1f9d8f' },
  { key:'strategy',  name:'Strategy Agent',        short:'ST', color:'#c2700f' },
  { key:'wireframe', name:'Wireframe Agent',       short:'WF', color:'#6f57d4' },
  { key:'visual',    name:'Visual Design Agent',   short:'VD', color:'#d4456b' },
  { key:'persona',   name:'Persona Review Agent',  short:'PR', color:'#2e8157' },
  { key:'ecd',       name:'ECD Agent',             short:'EC', color:'#2f5bea' },
];
const AGENT_MAP = Object.fromEntries(AGENTS.map(a => [a.key, a]));

const PHASES = [
  { agent:null,        kind:'idle',     eyebrow:'INTAKE',                      title:'A new brief just landed',                               sub:'The Research Agent picks it up and synthesizes context from five project sources.' },
  { agent:'research',  kind:'research', eyebrow:'RESEARCH AGENT',              title:'Research Brief',                                        sub:'Five inputs synthesized into the signal that matters for the test request flow.' },
  { agent:'strategy',  kind:'strategy', eyebrow:'STRATEGY AGENT',              title:'Design Brief',                                          sub:'Goals, persona, and constraints — with the Axiom Design System wired in.' },
  { agent:'wireframe', kind:'concepts', eyebrow:'WIREFRAME AGENT · PARALLEL',  title:'Three directions, generated at once',                    sub:'The Wireframe Agent ran three explorations in parallel. A human picks the direction.' },
  { agent:'visual',    kind:'visual',   eyebrow:'VISUAL DESIGN AGENT',         title:'Hi-fi concept',                                         sub:'The Visual Design Agent applied the Axiom Design System to the chosen direction.' },
  { agent:'persona',   kind:'persona',  eyebrow:'PERSONA REVIEW AGENT',        title:'Persona review — Devon',                                sub:'Validated against the defined persona. This is the AI governance moment.' },
  { agent:'ecd',       kind:'ecd',      eyebrow:'ECD AGENT · GATE',            title:'Executive Creative Director gate',                      sub:'The ECD reviews feedback and concept, then a human confirms the promotion.' },
  { agent:'ecd',       kind:'promoted', eyebrow:'PROMOTED',                    title:'Promoted to the Shared Canvas',                         sub:'Traceable from brief to approved — now visible to the whole team.' },
];

const DIRECTIONS = [
  { id:'A', name:'Single-screen form',   desc:'All fields on one focused screen — minimal steps, maximum speed.', tone:'#6f57d4' },
  { id:'B', name:'Guided step flow',     desc:'Multi-step wizard with a visible progress rail and smart defaults.', tone:'#2f5bea' },
  { id:'C', name:'Conversational',       desc:'Chat-led intake that infers type, priority, and owner from answers.', tone:'#1f9d8f' },
];

const PHASE_BTN_LABELS = [
  'Start the flow',
  'Continue',
  'Continue',
  'Select a direction to continue',
  'Run persona review',
  'Send to ECD review',
  'Approve & promote to canvas',
  'Flow complete',
];

const PHASE_EVENTS = {
  1: [{ a:'research',  t:'Synthesized 5 inputs into a Research Brief', tag:'' }],
  2: [
    { a:'strategy', t:'Converted brief → Design Brief (goals · persona · constraints)', tag:'' },
    { a:'ecd',      t:'Flagged Design Brief ready for concepting', tag:'gate' },
  ],
  3: [{ a:'wireframe', t:'Spawned 3 directions in parallel · all Exploring', tag:'parallel' }],
  4: [{ a:'visual',    t:'Applied Axiom Design System to selected direction', tag:'' }],
  5: [{ a:'persona',   t:'Returned structured feedback vs. persona "Devon Park"', tag:'' }],
  6: [{ a:'ecd',       t:'Reviewed persona feedback — concept meets the bar', tag:'' }],
  7: [{ a:'ecd',       t:'Approved & promoted to Shared Canvas', tag:'promote' }],
};

const PROV_BY_KIND = {
  wire: [
    { a:'strategy',  t:'Design Brief handed off', tag:'' },
    { a:'wireframe', t:'Generated as one of 3 parallel directions', tag:'parallel' },
  ],
  hifi: [
    { a:'wireframe', t:'Wireframe direction selected by human', tag:'human' },
    { a:'visual',    t:'Axiom Design System applied', tag:'' },
    { a:'persona',   t:'Persona review returned', tag:'' },
    { a:'ecd',       t:'ECD approved · promoted', tag:'promote' },
  ],
  brief: [
    { a:'research', t:'Synthesized 5 project inputs', tag:'' },
    { a:'ecd',      t:'Promoted to shared canvas', tag:'promote' },
  ],
};

const IDENTITY_NAMES = ['Chorus', 'Quorum', 'Atelier'];

const state = {
  view: 'canvas',
  phase: 0,
  selectedDir: null,
  events: [],
  detail: null,
  identityIdx: 0,
  editModes: {},
  dirPanels: {},
  pipelineOpen: true,
  feedOpen: true,
  feedTab: 'activity',   // 'activity' | 'chat'
  chatMessages: [],
  chatTyping: false,
};

const BASE_CANVAS = {
  exploring: [
    { id:'ex-a', kind:'wire', kindLabel:'WIREFRAME', title:'Direction A — Single-screen form',   agent:'Wireframe Agent', agentShort:'WF', agentColor:'#6f57d4', time:'5m' },
    { id:'ex-b', kind:'wire', kindLabel:'WIREFRAME', title:'Direction B — Guided step flow',     agent:'Wireframe Agent', agentShort:'WF', agentColor:'#6f57d4', time:'5m' },
    { id:'ex-c', kind:'wire', kindLabel:'WIREFRAME', title:'Direction C — Conversational',       agent:'Wireframe Agent', agentShort:'WF', agentColor:'#6f57d4', time:'5m' },
  ],
  review: [
    { id:'rv-b', kind:'hifi', kindLabel:'HI-FI CONCEPT', title:'Direction B — Axiom system applied', agent:'Visual Design Agent', agentShort:'VD', agentColor:'#d4456b', time:'2m', tone:'#2f5bea' },
  ],
  approved: [
    { id:'ap-1', kind:'hifi', kindLabel:'HI-FI CONCEPT', title:'Request intake — step 1 of 3', agent:'ECD Agent', agentShort:'EC', agentColor:'#2f5bea', time:'just now', tone:'#2e8157' },
  ],
  promoted: [
    { id:'pr-1', kind:'hifi',  kindLabel:'PROMOTED',       title:'Test request form — v1',                    agent:'ECD Agent',      agentShort:'EC', agentColor:'#2f5bea', time:'2h',  tone:'#2f5bea' },
    { id:'pr-2', kind:'brief', kindLabel:'RESEARCH BRIEF', title:'Axiom intake — context synthesis',           agent:'Research Agent', agentShort:'RE', agentColor:'#1f9d8f', time:'3h' },
  ],
};

// ─── STATE HELPERS ────────────────────────────────────────────────────────────

function setState(updates) {
  Object.assign(state, updates);
  render();
}
function setView(v) { setState({ view: v }); }
function advance() {
  if (state.phase === 3 && !state.selectedDir) return;
  if (state.phase >= 7) return;
  const next = state.phase + 1;
  const newEvents = (PHASE_EVENTS[next] || []).map(e => ({ ...e }));
  setState({ phase: next, events: [...newEvents, ...state.events] });
}
function resetFlow() { setState({ phase: 0, selectedDir: null, events: [], editModes: {}, dirPanels: {}, chatMessages: [], chatTyping: false }); }
function selectDir(id) { if (state.phase === 3) setState({ selectedDir: id }); }
function cycleIdentity() { setState({ identityIdx: (state.identityIdx + 1) % IDENTITY_NAMES.length }); }
function openDetail(cardId) { setState({ detail: cardId }); }
function closeDetail() { setState({ detail: null }); }

// Maps each canvas card to the pipeline phase (and direction) it represents
const CARD_PHASE_MAP = {
  'ex-a': { phase: 3, selectedDir: null },
  'ex-b': { phase: 3, selectedDir: null },
  'ex-c': { phase: 3, selectedDir: null },
  'rv-b': { phase: 5, selectedDir: 'B' },
  'ap-1': { phase: 6, selectedDir: 'B' },
  'pr-1': { phase: 7, selectedDir: 'B' },
  'pr-2': { phase: 1, selectedDir: null },
};

function eventsUpToPhase(targetPhase) {
  const events = [];
  for (let i = targetPhase; i >= 1; i--) {
    (PHASE_EVENTS[i] || []).forEach(e => events.push({ ...e }));
  }
  return events;
}

function goToDesignView(e, cardId) {
  e && e.stopPropagation();
  const mapping = cardId ? (CARD_PHASE_MAP[cardId] || { phase: 7, selectedDir: state.selectedDir }) : null;
  if (mapping) {
    setState({
      view: 'workspace',
      detail: null,
      phase: mapping.phase,
      selectedDir: mapping.selectedDir !== undefined ? mapping.selectedDir : state.selectedDir,
      events: eventsUpToPhase(mapping.phase),
    });
  } else {
    setState({ view: 'workspace', detail: null });
  }
}

// ─── PANEL TOGGLE ─────────────────────────────────────────────────────────────

function togglePipeline() { setState({ pipelineOpen: !state.pipelineOpen }); }
function toggleFeed()     { setState({ feedOpen: !state.feedOpen }); }
function switchFeedTab(tab) { setState({ feedTab: tab }); }

// ─── AI CHAT ─────────────────────────────────────────────────────────────────

const CHAT_REPLIES = [
  "The research brief is clear: the abandon rate clusters at priority tagging. Whatever direction you choose, that field needs auto-suggest or a smart default — not a blank dropdown.",
  "Devon Park's persona signals speed over comprehensiveness. Any field that's not essential for triage should be optional, with smart defaults pulled from issue tracker context.",
  "Looking at the references — Linear's intake pattern is your strongest benchmark. Short, contextual, no mandatory fields on first submission.",
  "The Axiom amber token is semantically aligned with 'suggested but skippable' — a strong fit for the priority auto-suggest highlight shown in the hi-fi.",
  "Three directions are in play. My read: Direction B (guided steps) has the highest chance of solving Devon's time-pressure problem without overwhelming non-technical clients.",
  "The Severity vs Priority label conflict flagged in the persona review is worth resolving next — Devon will read them as the same field and one will feel redundant.",
];

function getChatReply(text) {
  const idx = (text.length * 3 + state.phase * 7 + state.chatMessages.length) % CHAT_REPLIES.length;
  return CHAT_REPLIES[idx];
}

function sendChat() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const msgs = [...state.chatMessages, { role: 'user', text }];
  // Route message to the active agent in the activity feed
  const activeAgentKey = state.phase > 0 && state.phase < 8 ? PHASES[state.phase].agent : null;
  const newEvents = activeAgentKey
    ? [{ a: activeAgentKey, t: text, tag: 'directed' }, ...state.events]
    : state.events;
  setState({ chatMessages: msgs, chatTyping: true, events: newEvents });
  setTimeout(() => { const el = document.getElementById('chat-messages'); if (el) el.scrollTop = el.scrollHeight; }, 30);
  setTimeout(() => {
    setState({ chatMessages: [...state.chatMessages, { role: 'ai', text: getChatReply(text) }], chatTyping: false });
    setTimeout(() => { const el = document.getElementById('chat-messages'); if (el) el.scrollTop = el.scrollHeight; }, 30);
  }, 1400);
}

// ─── INLINE EDIT ─────────────────────────────────────────────────────────────

function toggleEdit(cardId) {
  const newModes = Object.assign({}, state.editModes);
  newModes[cardId] = !newModes[cardId];
  state.editModes = newModes;
  const card = document.getElementById(cardId);
  if (!card) return;
  const isEdit = newModes[cardId];
  card.querySelectorAll('[data-ed]').forEach(el => {
    el.contentEditable = isEdit ? 'true' : 'false';
  });
  const btn = document.getElementById('edit-btn-' + cardId);
  if (btn) {
    btn.textContent = isEdit ? 'Save ✓' : '✎ Edit';
    btn.className = 'edit-btn' + (isEdit ? ' saving' : '');
  }
}

// ─── THUMBNAILS ───────────────────────────────────────────────────────────────

function wireThumbnail(h) {
  h = h || 96;
  return `<div style="height:${h}px;border-radius:7px;background:${TOKENS.surfaceWarm};border:1px solid ${TOKENS.border};padding:9px;display:flex;flex-direction:column;gap:6px;overflow:hidden">
    <div style="display:flex;gap:5px;align-items:center">
      <div style="width:12px;height:12px;border:1.5px solid ${TOKENS.border2};border-radius:3px;flex:none"></div>
      <div style="height:6px;width:38%;background:${TOKENS.border2};border-radius:2px"></div>
      <div style="height:9px;width:20px;border:1.5px solid ${TOKENS.border2};border-radius:3px;margin-left:auto"></div>
    </div>
    <div style="height:4px;width:90%;background:${TOKENS.border};border-radius:2px"></div>
    <div style="height:18px;border:1.5px solid ${TOKENS.border};border-radius:4px;background:${TOKENS.surface};display:flex;align-items:center;padding:0 6px">
      <div style="height:4px;width:55%;background:${TOKENS.border};border-radius:2px"></div>
    </div>
    <div style="height:18px;border:1.5px solid ${TOKENS.border};border-radius:4px;background:${TOKENS.surface};display:flex;align-items:center;padding:0 6px">
      <div style="height:4px;width:40%;background:${TOKENS.border};border-radius:2px"></div>
    </div>
    <div style="flex:1;display:flex;gap:5px;align-items:flex-end">
      <div style="flex:1;height:10px;border:1.5px solid ${TOKENS.border2};border-radius:4px;background:${TOKENS.surface2}"></div>
      <div style="height:10px;width:32px;background:${TOKENS.border2};border-radius:4px"></div>
    </div>
  </div>`;
}

function hifiThumbnail(tone, h) {
  h = h || 96;
  return `<div style="height:${h}px;border-radius:7px;background:${TOKENS.surface};border:1px solid ${TOKENS.border};overflow:hidden;display:flex;flex-direction:column">
    <div style="height:28px;background:${tone};display:flex;align-items:center;padding:0 9px;gap:6px;flex:none">
      <div style="width:24%;height:6px;background:rgba(255,255,255,.9);border-radius:3px"></div>
      <div style="display:flex;gap:3px;margin-left:auto">
        <div style="width:12px;height:8px;background:rgba(255,255,255,.5);border-radius:2px"></div>
        <div style="width:12px;height:8px;background:rgba(255,255,255,.5);border-radius:2px"></div>
      </div>
    </div>
    <div style="flex:1;padding:9px 10px;display:flex;flex-direction:column;gap:5px">
      <div style="height:5px;width:70%;background:${TOKENS.text};border-radius:3px"></div>
      <div style="height:4px;width:90%;background:${TOKENS.surface2};border-radius:3px"></div>
      <div style="height:13px;background:${TOKENS.surface2};border-radius:3px;margin-top:2px"></div>
      <div style="height:13px;background:${TOKENS.surface2};border-radius:3px"></div>
      <div style="height:13px;width:50%;background:${tone};border-radius:5px;margin-top:4px"></div>
    </div>
  </div>`;
}

function briefThumbnail(h) {
  h = h || 96;
  return `<div style="height:${h}px;border-radius:7px;background:${TOKENS.surface};border:1px solid ${TOKENS.border};padding:10px;display:flex;flex-direction:column;gap:5px;overflow:hidden">
    <div style="height:7px;width:50%;background:${TOKENS.border2};border-radius:3px"></div>
    <div style="height:4px;width:92%;background:${TOKENS.border};border-radius:3px;margin-top:3px"></div>
    <div style="height:4px;width:84%;background:${TOKENS.border};border-radius:3px"></div>

// ─── PIPELINE RAIL ────────────────────────────────────────────────────────────

function renderPipelineRail() {
  const ph = state.phase;
  const activeAgent = ph > 0 && ph < 8 ? PHASES[ph].agent : null;
  const doneAgents = new Set();
  for (let i = 1; i < ph; i++) { if (PHASES[i].agent) doneAgents.add(PHASES[i].agent); }
  if (ph >= 7) doneAgents.add('ecd');

  let html = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:8px">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${TOKENS.text3};letter-spacing:1px;margin-bottom:6px">SEQUENTIAL PIPELINE</div>
        <div style="font-size:15px;font-weight:700;margin-bottom:3px">Design workflow spine</div>
        <div style="font-size:11.5px;color:${TOKENS.text3}">Use the <strong>AI Chat</strong> tab to direct agents.</div>
      </div>
      <button onclick="togglePipeline()" title="Close panel"
        style="width:26px;height:26px;flex:none;border-radius:7px;background:transparent;border:1px solid ${TOKENS.border};color:${TOKENS.text3};font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">‹</button>
    </div>
  `;

  AGENTS.forEach((agent, idx) => {
    const isActive = agent.key === activeAgent;
    const isDone = doneAgents.has(agent.key);
    const isLast = idx === AGENTS.length - 1;
    const statusText = isActive ? 'Working…' : isDone ? 'Done' : 'Queued';
    const statusColor = isActive ? agent.color : isDone ? TOKENS.green : TOKENS.text3;
    const lineColor = isDone ? agent.color : TOKENS.border;

    let dotHtml = '';
    if (isActive) {
      dotHtml = `<div style="position:relative;width:28px;height:28px;flex:none">
        <div style="position:absolute;inset:-5px;border-radius:13px;border:2px solid ${agent.color};opacity:.5;animation:ch-pulse 1.4s ease-in-out infinite"></div>
        <div style="width:28px;height:28px;border-radius:9px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:#fff;position:relative;z-index:1">${agent.short}</div>
      </div>`;
    } else if (isDone) {
      dotHtml = `<div style="width:28px;height:28px;border-radius:9px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none">✓</div>`;
    } else {
      dotHtml = `<div style="width:28px;height:28px;border-radius:9px;background:transparent;border:1.5px solid ${TOKENS.border2};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:${TOKENS.text3};flex:none">${agent.short}</div>`;
    }

    html += `
      <div style="display:flex;gap:11px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;align-items:center">
          ${dotHtml}
          ${!isLast ? `<div style="width:2px;min-height:16px;background:${lineColor};margin:3px 0;flex:1"></div>` : ''}
        </div>
        <div style="padding-top:3px;padding-bottom:${isLast?0:18}px;flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;line-height:1.2;margin-bottom:3px">${agent.name}</div>
          <div style="font-size:11px;color:${statusColor}">${statusText}</div>
        </div>
      </div>
    `;
  });

  html += `
    <div style="margin-top:auto;padding-top:20px">
      <button onclick="resetFlow()" style="width:100%;border:1px solid ${TOKENS.border};background:${TOKENS.surface};color:${TOKENS.text2};border-radius:9px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Hanken Grotesk',sans-serif">↺ Reset flow</button>
    </div>
  `;

  document.querySelector('.pipeline-rail').innerHTML = html;
}

// ─── STAGE RENDER ─────────────────────────────────────────────────────────────

function renderStage() {
  const ph = state.phase;
  const stage = document.querySelector('.stage');
  const btnLabel = PHASE_BTN_LABELS[ph];
  const isGate = ph === 3 && !state.selectedDir;
  const btnDisabled = isGate || ph >= 7;
  const btnStyle = btnDisabled
    ? `background:${TOKENS.border};color:${TOKENS.text3};cursor:not-allowed;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;border:none;font-family:'Hanken Grotesk',sans-serif`
    : `background:${TOKENS.brand};color:${TOKENS.bgCanvas};border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;border:none;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;transition:opacity .15s`;

  stage.innerHTML = `
    ${stageEyebrow(ph)}
    <div style="flex:1">${stageContent(ph)}</div>
    ${ph < 7 ? `
    <div style="flex:none;display:flex;align-items:center;gap:14px;padding-top:18px;border-top:1px solid ${TOKENS.border};margin-top:20px">
      <button id="next-btn" onclick="advance()" ${btnDisabled?'disabled':''} style="${btnStyle}">${btnLabel} <span style="font-size:16px">→</span></button>
      <span style="font-size:12px;color:${TOKENS.text3}">Step through the flow — each handoff is a visible event in the feed.</span>
    </div>
    ` : ''}
  `;

  // Re-apply edit states after re-render
  Object.entries(state.editModes).forEach(([cardId, isEdit]) => {
    if (!isEdit) return;
    const card = document.getElementById(cardId);
    if (!card) return;
    card.querySelectorAll('[data-ed]').forEach(el => { el.contentEditable = 'true'; });
    const btn = document.getElementById('edit-btn-' + cardId);
    if (btn) { btn.textContent = 'Save ✓'; btn.className = 'edit-btn saving'; }
  });
}

// ─── FEED RAIL ────────────────────────────────────────────────────────────────

function tagChip(tag) {
  if (!tag) return '';
  if (tag === 'parallel')  return `<span class="tag-chip" style="color:${TOKENS.purple};background:${TOKENS.purpleLight}">PARALLEL · 3 AGENTS</span>`;
  if (tag === 'promote')   return `<span class="tag-chip" style="color:${TOKENS.green};background:${TOKENS.greenLight}">GATE PASSED → PROMOTED</span>`;
  if (tag === 'gate')      return `<span class="tag-chip" style="color:${TOKENS.blue};background:${TOKENS.blueLight}">GOVERNANCE</span>`;
  if (tag === 'human')     return `<span class="tag-chip" style="color:${TOKENS.amber};background:${TOKENS.amberLight}">HUMAN IN THE LOOP</span>`;
  if (tag === 'directed')  return `<span class="tag-chip" style="color:${TOKENS.amber};background:${TOKENS.amberLight}">→ DIRECTED BY YOU</span>`;
  return '';
}

function renderFeed() {
  const feed = document.querySelector('.feed-rail');
  if (!feed) return;
  const isActivity = state.feedTab === 'activity';
  const events = state.events;

  // ── Activity content ──
  let activityContent = '';
  if (events.length === 0) {
    activityContent = `<div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"><div style="font-size:13px;color:${TOKENS.text3};line-height:1.55">Start the flow — or direct an agent — to see activity here.</div></div>`;
  } else {
    activityContent = `<div style="flex:1;overflow-y:auto">${events.map(ev => {
      const agent = AGENT_MAP[ev.a];
      const isDirected = ev.tag === 'directed';
      return `
        <div class="event-card" style="${isDirected ? `border-color:${agent.color};border-left:3px solid ${agent.color};` : ''}">
          <div style="display:flex;align-items:center;margin-bottom:6px">
            <div style="width:20px;height:20px;border-radius:5px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#fff;flex:none">${agent.short}</div>
            <span style="font-size:12px;font-weight:700;margin-left:7px">${isDirected ? 'You → ' : ''}${agent.name}</span>
            <span style="font-size:11px;color:${TOKENS.text3};margin-left:auto">just now</span>
          </div>
          <div style="font-size:12.5px;color:${TOKENS.text2};line-height:1.45">${ev.t}</div>
          ${tagChip(ev.tag)}
        </div>`;
    }).join('')}</div>`;
  }

  // ── Chat content ──
  const msgs = state.chatMessages;
  const chatMessages = msgs.length === 0
    ? `<div style="padding:12px 14px;background:${TOKENS.surfaceWarm};border:1px solid ${TOKENS.border};border-radius:10px;animation:ch-rise .3s ease">
        <div style="font-size:11px;font-weight:700;color:${TOKENS.text3};font-family:'JetBrains Mono',monospace;letter-spacing:.5px;margin-bottom:6px">CHORUS AI</div>
        <div style="font-size:13px;color:${TOKENS.text2};line-height:1.55">Ask me anything about the Axiom project — the brief, persona, design direction, or current phase. I have full context.</div>
      </div>`
    : msgs.map(m => {
        const isUser = m.role === 'user';
        return `<div style="display:flex;flex-direction:column;align-items:${isUser ? 'flex-end' : 'flex-start'};margin-bottom:10px">
          ${!isUser ? `<div style="font-size:9.5px;font-weight:700;color:${TOKENS.text3};font-family:'JetBrains Mono',monospace;letter-spacing:.5px;margin-bottom:4px">CHORUS AI</div>` : ''}
          <div style="background:${isUser ? TOKENS.brand : TOKENS.surfaceWarm};color:${isUser ? TOKENS.bgCanvas : TOKENS.text};border:1px solid ${isUser ? 'transparent' : TOKENS.border};border-radius:${isUser ? '10px 10px 3px 10px' : '3px 10px 10px 10px'};padding:9px 12px;max-width:92%;font-size:12.5px;line-height:1.55">
            ${m.text}
          </div>
        </div>`;
      }).join('');

  const typingBubble = state.chatTyping ? `
    <div style="display:flex;flex-direction:column;align-items:flex-start;margin-bottom:10px">
      <div style="font-size:9.5px;font-weight:700;color:${TOKENS.text3};font-family:'JetBrains Mono',monospace;letter-spacing:.5px;margin-bottom:4px">CHORUS AI</div>
      <div style="background:${TOKENS.surfaceWarm};border:1px solid ${TOKENS.border};border-radius:3px 10px 10px 10px;padding:10px 14px;display:flex;gap:4px;align-items:center">
        <span style="width:5px;height:5px;border-radius:50%;background:${TOKENS.text3};display:inline-block;animation:ch-pulse 1s infinite"></span>
        <span style="width:5px;height:5px;border-radius:50%;background:${TOKENS.text3};display:inline-block;animation:ch-pulse 1s .2s infinite"></span>
        <span style="width:5px;height:5px;border-radius:50%;background:${TOKENS.text3};display:inline-block;animation:ch-pulse 1s .4s infinite"></span>
      </div>
    </div>` : '';

  // ── Tab bar ──
  const tabBar = `
    <div style="display:flex;align-items:center;border-bottom:1px solid ${TOKENS.border};margin:0 -16px 14px;padding:0 16px 0;flex:none">
      <button onclick="switchFeedTab('activity')"
        style="padding:9px 12px 8px;font-size:12px;font-weight:600;border:none;background:transparent;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;color:${isActivity ? TOKENS.text : TOKENS.text3};border-bottom:2px solid ${isActivity ? TOKENS.brand : 'transparent'};margin-bottom:-1px;transition:all .15s">Activity</button>
      <button onclick="switchFeedTab('chat')"
        style="padding:9px 12px 8px;font-size:12px;font-weight:600;border:none;background:transparent;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;color:${!isActivity ? TOKENS.text : TOKENS.text3};border-bottom:2px solid ${!isActivity ? TOKENS.brand : 'transparent'};margin-bottom:-1px;transition:all .15s">AI Chat</button>
      <button onclick="toggleFeed()" title="Close panel"
        style="margin-left:auto;width:24px;height:24px;border-radius:6px;background:transparent;border:1px solid ${TOKENS.border};color:${TOKENS.text3};font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;margin-bottom:1px">›</button>
    </div>`;

  feed.innerHTML = `
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${TOKENS.text3};letter-spacing:1px;margin-bottom:10px;flex:none">DESIGN TEAM</div>
    ${tabBar}

    <!-- Activity tab -->
    <div style="display:${isActivity ? 'flex' : 'none'};flex-direction:column;flex:1;min-height:0">
      <div style="font-size:14px;font-weight:700;margin-bottom:3px;flex:none">Every agent action, visible</div>
      <div style="font-size:11.5px;color:${TOKENS.text3};margin-bottom:12px;flex:none">Directions you send appear here too.</div>
      ${activityContent}
    </div>

    <!-- Chat tab -->
    <div style="display:${!isActivity ? 'flex' : 'none'};flex-direction:column;flex:1;min-height:0">
      ${(() => {
        const ak = state.phase > 0 && state.phase < 8 ? PHASES[state.phase].agent : null;
        const ag = ak ? AGENT_MAP[ak] : null;
        return ag
          ? `<div style="display:flex;align-items:center;gap:7px;padding:7px 10px;background:${TOKENS.surface2};border:1px solid ${TOKENS.border};border-radius:8px;margin-bottom:10px;flex:none">
               <div style="width:16px;height:16px;border-radius:4px;background:${ag.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;color:#fff;flex:none">${ag.short}</div>
               <span style="font-size:11.5px;color:${TOKENS.text2}">Directing <strong style="color:${TOKENS.text}">${ag.name}</strong> — messages also appear in the activity feed</span>
             </div>`
          : `<div style="padding:7px 10px;background:${TOKENS.surface2};border:1px solid ${TOKENS.border};border-radius:8px;margin-bottom:10px;font-size:11.5px;color:${TOKENS.text3};flex:none">No agent active — start the flow to direct agents</div>`;
      })()}
      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0;min-height:0;padding-bottom:4px" id="chat-messages">
        ${chatMessages}
        ${typingBubble}
      </div>
      <div style="flex:none;padding-top:10px;border-top:1px solid ${TOKENS.border};margin-top:8px">
        <div style="display:flex;gap:7px;align-items:flex-end">
          <textarea id="chat-input"
            placeholder="Direct the agent or ask a question…"
            style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid ${TOKENS.border};background:${TOKENS.surface};color:${TOKENS.text};font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;line-height:1.45;resize:none;height:58px;outline:none"
            onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){sendChat()}"
          ></textarea>
          <button onclick="sendChat()"
            style="padding:8px 13px;border-radius:8px;border:none;background:${TOKENS.brand};color:${TOKENS.bgCanvas};font-size:13px;font-weight:600;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;white-space:nowrap;align-self:flex-end">↑ Send</button>
        </div>
        <div style="font-size:10px;color:${TOKENS.text3};margin-top:5px">⌘ + Enter · directions are logged to the active agent</div>
      </div>
    </div>
  `;
}

// ─── WORKSPACE ────────────────────────────────────────────────────────────────

function renderWorkspace() {
  const ws = document.getElementById('workspace-view');

  const pipelineHtml = state.pipelineOpen
    ? '<aside class="pipeline-rail"></aside>'
    : `<div onclick="togglePipeline()" title="Open pipeline"
         style="width:30px;flex:none;background:${TOKENS.surface2};border-right:1px solid ${TOKENS.border};display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s"
         onmouseover="this.style.background='${TOKENS.border}'"
         onmouseout="this.style.background='${TOKENS.surface2}'">
         <span style="writing-mode:vertical-rl;font-size:10px;font-weight:600;color:${TOKENS.text3};letter-spacing:.5px;text-transform:uppercase;transform:rotate(180deg);padding:10px 0">▷ Pipeline</span>
       </div>`;

  const feedHtml = state.feedOpen
    ? '<aside class="feed-rail"></aside>'
    : `<div onclick="toggleFeed()" title="Open feed"
         style="width:30px;flex:none;background:${TOKENS.surface2};border-left:1px solid ${TOKENS.border};display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s"
         onmouseover="this.style.background='${TOKENS.border}'"
         onmouseout="this.style.background='${TOKENS.surface2}'">
         <span style="writing-mode:vertical-rl;font-size:10px;font-weight:600;color:${TOKENS.text3};letter-spacing:.5px;text-transform:uppercase;padding:10px 0">Feed ◁</span>
       </div>`;

  ws.innerHTML = `${pipelineHtml}<main class="stage"></main>${feedHtml}`;
  if (state.pipelineOpen) renderPipelineRail();
  renderStage();
  if (state.feedOpen) renderFeed();
}

// ─── DETAIL DRAWER ────────────────────────────────────────────────────────────

function findCard(id) {
  const all = [
    ...BASE_CANVAS.exploring, ...BASE_CANVAS.review,
    ...BASE_CANVAS.approved,  ...BASE_CANVAS.promoted,
  ];
  if (state.phase >= 7 && state.selectedDir) {
    const dir = DIRECTIONS.find(d => d.id === state.selectedDir);
    all.unshift({ id:'pr-fresh', kind:'hifi', kindLabel:'JUST PROMOTED', title:`Test Request — Direction ${dir.id} · ${dir.name}`, fresh:true, agent:'ECD Agent', agentShort:'EC', agentColor:'#2f5bea', time:'just now', tone:dir.tone });
  }
  return all.find(c => c.id === id);
}

function provStep(step) {
  const agent = AGENT_MAP[step.a];
  return `
    <div class="prov-step">
      <div style="width:20px;height:20px;border-radius:5px;background:${agent.color};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#fff;flex:none;margin-top:1px">${agent.short}</div>
      <div>
        <div style="font-size:12px;font-weight:600;color:${TOKENS.text}">${agent.name}</div>
        <div style="font-size:12px;color:${TOKENS.text2};line-height:1.4">${step.t}</div>
        ${step.tag ? `<div>${tagChip(step.tag)}</div>` : ''}
      </div>
    </div>
  `;
}

function renderDrawer() {
  const root = document.getElementById('drawer-root');
  if (!state.detail) { root.innerHTML = ''; return; }
  const card = findCard(state.detail);
  if (!card) { root.innerHTML = ''; return; }

  const tone = card.tone || card.agentColor || '#6f57d4';
  const kindColor = card.agentColor || tone;
  const prov = PROV_BY_KIND[card.kind] || [];
  const isHifi = card.kind === 'hifi';
  const isApproved = card.kindLabel === 'PROMOTED' || card.kindLabel === 'JUST PROMOTED' || card.id === 'ap-1';
  const statusText = card.kindLabel === 'PROMOTED' || card.kindLabel === 'JUST PROMOTED' ? 'Promoted'
    : card.id === 'ap-1' ? 'Approved'
    : card.id === 'rv-b' ? 'In Review'
    : 'Exploring';

  const personaMini = isHifi ? `
    <div style="border-top:1px solid ${TOKENS.border};padding-top:14px;margin-top:14px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.8px;color:${TOKENS.text3};font-weight:600;margin-bottom:10px">PERSONA REVIEW · Devon Park</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px"><span style="color:${TOKENS.green};font-weight:700;flex:none">✓</span><span>Priority auto-suggest removes biggest drop-off.</span></div>
        <div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px"><span style="color:${TOKENS.green};font-weight:700;flex:none">✓</span><span>Single primary action — Devon won't stall.</span></div>
        <div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px;background:${TOKENS.amberLight};border-radius:7px;padding:8px;border:1px solid ${isDark()?'#5a4010':'#ecd9a8'}"><span style="color:${TOKENS.amber};font-weight:700;flex:none">!</span><span>"Severity" vs "Priority" — consolidate or explain.</span></div>
      </div>
    </div>
  ` : '';

  const ecdMini = isApproved ? `
    <div style="background:${TOKENS.blueLight};border-radius:10px;padding:12px;margin-top:14px;border:1px solid ${isDark()?'#1a3070':'#cfdcfb'}">
      <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.8px;color:${TOKENS.blue};font-weight:600;margin-bottom:8px">ECD GATE PASSED</div>
      <div style="font-size:12.5px;line-height:1.45;color:${isDark()?'#7a9ef5':'#1e3a8a'}">Concept meets the brief. Axiom DS applied consistently. Promoted to shared canvas.</div>
    </div>
  ` : '';

  root.innerHTML = `
    <div style="position:absolute;inset:0;z-index:50;display:flex;justify-content:flex-end">
      <div style="position:absolute;inset:0;background:rgba(24,23,26,.32);animation:ch-rise .2s ease" onclick="closeDetail()"></div>
      <div style="width:440px;max-width:90vw;height:100%;background:${TOKENS.surface};border-left:1px solid ${TOKENS.border};box-shadow:-12px 0 40px rgba(20,18,12,.14);animation:ch-rise .25s ease;overflow-y:auto;position:relative;z-index:1;display:flex;flex-direction:column">
        <div style="padding:20px 20px 16px;border-bottom:1px solid ${TOKENS.border};flex:none">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:${kindColor};letter-spacing:.5px">${card.kindLabel}</span>
            <div style="display:flex;align-items:center;gap:5px;margin-left:auto;background:${TOKENS.surface2};border-radius:6px;padding:4px 9px">
              <span style="width:6px;height:6px;border-radius:50%;background:${kindColor};flex:none"></span>
              <span style="font-size:11.5px;font-weight:600;color:${TOKENS.text}">${statusText}</span>
            </div>
            <button onclick="closeDetail()" style="background:transparent;border:1px solid ${TOKENS.border};border-radius:7px;padding:5px 10px;font-size:14px;color:${TOKENS.text2};cursor:pointer;flex:none">✕</button>
          </div>
          <div style="font-family:'Instrument Serif',serif;font-size:24px;line-height:1.25;margin-bottom:12px">${card.title}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
            <div style="width:20px;height:20px;border-radius:5px;background:${card.agentColor};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#fff;flex:none">${card.agentShort}</div>
            <span style="font-size:12.5px;color:${TOKENS.text2}">Owned by ${card.agent}</span>
          </div>
          <button onclick="goToDesignView(null,'${card.id}')"
            style="width:100%;padding:10px 16px;border-radius:9px;border:none;background:${TOKENS.brand};color:${TOKENS.bgCanvas};font-size:13px;font-weight:700;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s"
            onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
            Open Design View
            <span style="font-size:16px">→</span>
          </button>
        </div>
        <div style="padding:18px 20px;flex:1;overflow-y:auto">
          ${isHifi  ? `<div style="margin-bottom:18px">${hifiThumbnail(tone, 140)}</div>` : ''}
          ${card.kind === 'wire'  ? `<div style="margin-bottom:18px">${wireThumbnail(110)}</div>` : ''}
          ${card.kind === 'brief' ? `<div style="margin-bottom:18px">${briefThumbnail(110)}</div>` : ''}
          <div style="border-top:1px solid ${TOKENS.border};padding-top:14px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.8px;color:${TOKENS.text3};font-weight:600;margin-bottom:4px">PROVENANCE · how this got here</div>
            ${prov.map(provStep).join('')}
          </div>
          ${personaMini}
          ${ecdMini}
        </div>
      </div>
    </div>
  `;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────

function render() {
  renderHeader();
  const canvasEl = document.getElementById('canvas-view');
  const workspaceEl = document.getElementById('workspace-view');
  if (state.view === 'canvas') {
    canvasEl.style.display = 'flex';
    workspaceEl.style.display = 'none';
    renderCanvas();
  } else {
    canvasEl.style.display = 'none';
    workspaceEl.style.display = 'flex';
    renderWorkspace();
  }
  renderDrawer();
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.key === ' ' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (state.phase !== 3 || state.selectedDir) advance();
  }
  if (e.key === 'Escape' && state.detail) closeDetail();
});

// ─── BOOT ─────────────────────────────────────────────────────────────────────

render();
</script>
</body>
</html>

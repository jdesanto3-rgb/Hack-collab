<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weave v6 — Test Request Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Sofia Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg-canvas);background-image:radial-gradient(ellipse at 15% 25%, color-mix(in srgb,var(--brand) 4%,transparent) 0%,transparent 50%),radial-gradient(ellipse at 85% 75%, color-mix(in srgb,var(--amber) 3%,transparent) 0%,transparent 50%)}
button{font-family:'Sofia Sans',sans-serif;border:none;cursor:pointer}
a{text-decoration:none;color:inherit}

@keyframes ch-rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes ch-pop{0%{transform:translateY(10px) scale(.975);opacity:0}60%{transform:translateY(-2px) scale(1.006)}100%{transform:none;opacity:1}}
@keyframes ch-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-ring{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes figma-cursor-a{0%{transform:translate(182px,144px)}25%{transform:translate(210px,168px)}50%{transform:translate(196px,155px)}75%{transform:translate(218px,140px)}100%{transform:translate(182px,144px)}}
@keyframes figma-cursor-b{0%{transform:translate(140px,220px)}30%{transform:translate(158px,238px)}70%{transform:translate(145px,228px)}100%{transform:translate(140px,220px)}}
@keyframes comment-pop{from{transform:scale(.85) translateY(6px);opacity:0}to{transform:none;opacity:1}}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--border2,#cfcabd);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;background:linear-gradient(to bottom,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--bg-canvas)));border-bottom:1px solid color-mix(in srgb,var(--border) 80%,transparent);display:flex;align-items:center;padding:0 20px;gap:0;flex:none;z-index:10}
#body{flex:1;min-height:0;display:flex;overflow:hidden}

/* Left sidebar */
.left-sidebar{width:248px;flex:none;border-right:1px solid color-mix(in srgb,var(--border) 75%,transparent);overflow-y:auto;display:flex;flex-direction:column;background:linear-gradient(to bottom,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--bg-canvas)))}

/* Center */
.center-col{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg-canvas)}

/* Right sidebar */
.right-sidebar{width:288px;flex:none;border-left:1px solid color-mix(in srgb,var(--border) 75%,transparent);overflow-y:auto;display:flex;flex-direction:column;background:linear-gradient(to bottom,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--bg-canvas)))}

/* Object tree */
.obj-section-header{display:flex;align-items:center;gap:6px;padding:6px 14px;cursor:pointer;user-select:none;transition:background .12s}
.obj-section-header:hover{background:var(--surface2)}
.obj-count{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;opacity:.7}
.obj-item{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 32px;font-size:12.5px;cursor:pointer;transition:background .12s}
.obj-item:hover{background:var(--surface2)}
.obj-item.selected{background:var(--blue,#2f5bea)18;color:var(--blue,#2f5bea);font-weight:600}

/* Graph */
.graph-container{position:relative;width:100%;height:440px;overflow:hidden}
.graph-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transform:translate(-50%,-50%);transition:all .15s}
.graph-node .circle{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff;transition:all .2s;flex:none}
.graph-node .node-label{font-size:10px;text-align:center;max-width:72px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.graph-node:hover .circle{transform:scale(1.08)}

/* Agent rows */
.agent-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border)}
.agent-row:last-child{border-bottom:none}
.agent-badge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;color:#fff;flex:none;margin-top:1px}

/* Decision cards */
.decision-card{border-left:3px solid var(--border2);padding:7px 10px;margin-bottom:6px;border-radius:0 6px 6px 0;background:var(--surface2,#E8E3D9)30}

/* Tabs */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab-item{padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--text3);transition:all .15s;margin-bottom:-1px;display:flex;align-items:center;gap:5px}
.tab-item.active{color:var(--text);border-bottom-color:var(--blue,#2f5bea);font-weight:600}
.tab-item:hover:not(.active){color:var(--text2)}

/* Detail panel */
.detail-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 20px 0;animation:ch-rise .2s ease}

/* Section divider in right rail */
.rail-divider{height:1px;background:var(--border);margin:10px 0}
.rail-section-title{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.8px;color:var(--text3);padding:10px 16px 6px;text-transform:uppercase}

/* ── FIGMA DESIGN VIEW ── */
.figma-wrap{margin:20px;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 24px rgba(20,18,12,.10);animation:ch-rise .25s ease}
.figma-bar{height:44px;background:#1e1e1e;display:flex;align-items:center;padding:0 14px;gap:10px;flex:none}
.figma-logo{display:flex;align-items:center;gap:7px}
.figma-logo svg{flex:none}
.figma-file-name{font-size:12px;font-weight:600;color:#ffffffcc;font-family:'Sofia Sans',sans-serif}
.figma-breadcrumb{font-size:11px;color:#ffffff55;font-family:'Sofia Sans',sans-serif}
.figma-bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.figma-share-btn{padding:5px 13px;border-radius:6px;background:#5551ff;color:#fff;font-size:11.5px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.figma-share-btn:hover{opacity:.85}
.figma-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;border:2px solid #1e1e1e}

.figma-toolbar{height:36px;background:#2c2c2c;border-bottom:1px solid #3a3a3a;display:flex;align-items:center;padding:0 12px;gap:12px;flex:none}
.figma-tool{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#ffffffaa;cursor:pointer;transition:background .12s}
.figma-tool:hover,.figma-tool.on{background:#5551ff30;color:#8b88ff}
.figma-tool-sep{width:1px;height:16px;background:#3a3a3a;flex:none}
.figma-zoom{font-family:'JetBrains Mono',monospace;font-size:10px;color:#ffffff55;margin-left:auto}

.figma-body{display:flex;height:520px}
.figma-layers{width:200px;flex:none;background:#1e1e1e;border-right:1px solid #2e2e2e;overflow-y:auto}
.figma-layer-head{padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.6px;color:#ffffff44;border-bottom:1px solid #2e2e2e}
.figma-layer-item{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;transition:background .1s;color:#ffffffaa;font-size:11px}
.figma-layer-item:hover{background:#2e2e2e}
.figma-layer-item.sel{background:#5551ff22;color:#8b88ff}
.figma-layer-icon{font-size:10px;flex:none;width:14px;text-align:center}
.figma-layer-indent{padding-left:24px}
.figma-layer-indent2{padding-left:36px}

.figma-canvas{flex:1;background:#2c2c2c;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.figma-canvas-bg{position:absolute;inset:0;background-image:radial-gradient(circle,#3a3a3a 1px,transparent 1px);background-size:20px 20px;opacity:.6}

.figma-frame-wrap{position:relative;z-index:1}
.figma-frame-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#ffffff55;margin-bottom:6px;text-align:left}
.figma-frame{width:360px;background:#FAFAF9;border-radius:4px;overflow:visible;box-shadow:0 8px 40px rgba(0,0,0,.5);position:relative}
.figma-frame-inner{overflow:hidden;border-radius:4px}

/* Mock app in Figma */
.fig-app-nav{background:#18253A;padding:0 16px;height:42px;display:flex;align-items:center;gap:18px}
.fig-logo{font-size:13px;font-weight:700;color:#fff}
.fig-logo span{color:#4EC9A0}
.fig-nav{font-size:11px;color:rgba(255,255,255,.5)}
.fig-nav.on{color:#fff}
.fig-page{padding:18px 18px 14px;background:#FAFAF9}
.fig-bc{font-size:10px;color:#9C9890;margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.fig-h1{font-size:18px;color:#1C1914;margin-bottom:12px;font-weight:400}
.fig-steps{display:flex;align-items:center;gap:0;margin-bottom:16px}
.fig-step{display:flex;align-items:center;gap:5px}
.fig-step-circle{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700}
.fig-step-sep{width:22px;height:1px;background:#D8D2C6;margin:0 5px}
.fig-field{margin-bottom:12px}
.fig-label{font-size:10.5px;font-weight:600;color:#5C5752;margin-bottom:4px}
.fig-input{width:100%;padding:7px 9px;border:1px solid #D8D2C6;border-radius:6px;font-size:11.5px;color:#1C1914;background:#fff;font-family:'Sofia Sans',sans-serif}
.fig-input.active{border-color:#2f5bea;box-shadow:0 0 0 2px rgba(47,91,234,.12)}
.fig-suggest{display:flex;align-items:flex-start;gap:6px;padding:7px 9px;border-radius:6px;background:#FEF3C7;border:1px solid #FDE68A;margin-top:5px}
.fig-suggest-label{font-size:8.5px;font-family:'JetBrains Mono',monospace;font-weight:700;color:#B45309;display:block;margin-bottom:1px}
.fig-suggest-val{font-size:10px;color:#92400E}
.fig-pills{display:flex;gap:5px;flex-wrap:wrap}
.fig-pill{padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:500;border:1px solid #D8D2C6;background:#fff;color:#6B6860}
.fig-pill.sel{background:#1C1914;color:#fff;border-color:#1C1914}
.fig-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#fff;border-top:1px solid #E8E4DE}
.fig-btn-back{padding:8px 16px;border-radius:7px;font-size:11.5px;font-weight:600;background:#F4F2EF;color:#9C9890;border:1px solid #E8E4DE}
.fig-btn-cont{padding:8px 16px;border-radius:7px;font-size:11.5px;font-weight:700;background:#18253A;color:#fff;border:none}

/* Figma live cursors */
.figma-cursor{position:absolute;pointer-events:none;z-index:20}
.figma-cursor svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.figma-cursor-label{display:inline-flex;align-items:center;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700;color:#fff;white-space:nowrap;margin-top:2px;margin-left:3px}

/* Comment pins */
.figma-comment{position:absolute;cursor:pointer;z-index:15;animation:comment-pop .25s ease both}
.comment-pin{width:22px;height:22px;border-radius:50% 50% 50% 0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;transform:rotate(-45deg)}
.comment-pin-inner{transform:rotate(45deg);font-size:9px}
.comment-bubble{position:absolute;left:26px;top:-6px;background:#1e1e1e;border-radius:8px;padding:7px 10px;min-width:180px;max-width:220px;pointer-events:none;animation:comment-pop .2s ease .1s both;opacity:0;animation-fill-mode:both}
.comment-bubble::before{content:'';position:absolute;left:-5px;top:10px;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:5px solid #1e1e1e}
.figma-comment:hover .comment-bubble{opacity:1}
.cb-author{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:#8b88ff;margin-bottom:3px}
.cb-text{font-size:11px;color:#ffffffcc;line-height:1.4}
.cb-time{font-size:9.5px;color:#ffffff44;margin-top:3px}

/* Figma right inspect */
.figma-inspect{width:224px;flex:none;background:#1e1e1e;border-left:1px solid #2e2e2e;overflow-y:auto}
.inspect-head{padding:9px 12px;border-bottom:1px solid #2e2e2e;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.6px;color:#ffffff44}
.inspect-section{padding:10px 12px;border-bottom:1px solid #2e2e2e}
.inspect-label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:#ffffff33;letter-spacing:.5px;margin-bottom:6px}
.inspect-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.inspect-key{font-size:10.5px;color:#ffffff66}
.inspect-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:#ffffffbb}
.inspect-color{width:12px;height:12px;border-radius:3px;flex:none}

/* Review banner */
.review-banner{margin:0 20px 0;padding:12px 16px;background:linear-gradient(135deg,#5551ff18,#8b88ff0c);border:1px solid #5551ff44;border-radius:12px;display:flex;align-items:center;gap:12px;animation:ch-rise .2s ease .1s both}
.figma-icon-sm{width:28px;height:28px;border-radius:7px;background:#5551ff;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="body">
    <div class="left-sidebar" id="left-sidebar"></div>
    <div class="center-col" id="center-col"></div>
    <div class="right-sidebar" id="right-sidebar"></div>
  </div>
</div>
<script>
// ── TOKENS ────────────────────────────────────────────────────────────────────
function readTokens(){
  const s=getComputedStyle(document.documentElement),g=v=>s.getPropertyValue(v).trim();
  return{
    bgCanvas:g('--bg-canvas')||'#ecebe5',surface:g('--surface')||'#FDFAF6',
    surfaceWarm:g('--surface-warm')||'#fffdf8',surface2:g('--surface2')||'#E8E3D9',
    border:g('--border')||'#D8D2C6',border2:g('--border2')||'#C4BCAF',
    text:g('--text')||'#1C1914',text2:g('--text2')||'#6B6860',text3:g('--text3')||'#9C9890',
    brand:g('--brand')||'#1E1C18',
    blue:g('--blue')||'#2f5bea',blueLight:g('--blue-light')||'#e7eefe',
    green:g('--green')||'#2e8157',greenLight:g('--green-light')||'#e6f3ec',
    purple:g('--purple')||'#6f57d4',purpleLight:g('--purple-light')||'#efebfb',
    teal:g('--teal')||'#1f9d8f',tealLight:'#e0f3f2',
    amber:g('--amber')||'#c2700f',amberLight:g('--amber-light')||'#faeeda',
    red:g('--red')||'#d4456b',redLight:'#fce8ee',
    shadowSm:g('--shadow-sm')||'0 1px 2px rgba(28,25,20,.06)',
    shadowMd:g('--shadow-md')||'0 2px 8px rgba(28,25,20,.08)',
    shadowLg:g('--shadow-lg')||'0 4px 16px rgba(28,25,20,.10)',
  };
}
let T=readTokens();
function isDark(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark')return true;if(a==='light')return false;return window.matchMedia('(prefers-color-scheme:dark)').matches;}
function toggleTheme(){document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');T=readTokens();render();}

// ── DATA ──────────────────────────────────────────────────────────────────────
const OBJECT_TYPES=[
  {id:'research',  label:'Research',     icon:'🔬', color:'#1f9d8f', count:17, children:[]},
  {id:'opps',      label:'Opportunities',icon:'💡', color:'#c2700f', count:3,  children:[]},
  {id:'personas',  label:'Personas',     icon:'👤', color:'#6f57d4', count:2,
    children:['Devon Park — QA Engineer','Sarah Chen — QA Lead']},
  {id:'journeys',  label:'Journeys',     icon:'🗺️', color:'#2f5bea', count:4,  children:[]},
  {id:'reqs',      label:'Requirements', icon:'📋', color:'#4338ca', count:12, children:[]},
  {id:'flows',     label:'Flows',        icon:'🌊', color:'#0ea5e9', count:6,  children:[]},
  {id:'screens',   label:'Screens',      icon:'🖼️', color:'#d4456b', count:8,
    children:['Request Dashboard','Test Request Form','Priority Review Queue','Submission Confirmation','+4 more']},
  {id:'components',label:'Components',   icon:'🧩', color:'#2e8157', count:24, children:[]},
  {id:'exps',      label:'Experiments',  icon:'🧪', color:'#ea580c', count:2,  children:[]},
  {id:'metrics',   label:'Metrics',      icon:'📊', color:'#059669', count:4,  children:[]},
  {id:'decisions', label:'Decisions',    icon:'📝', color:'#7A6A5C', count:7,  children:[]},
];

const GRAPH_NODES=[
  {id:'research',  abbr:'RE', color:'#1f9d8f', label:'Research',    sub:'17 interviews', cx:.15, cy:.15, size:52},
  {id:'persona',   abbr:'PE', color:'#6f57d4', label:'Devon Park',  sub:'QA Engineer',   cx:.46, cy:.08, size:52},
  {id:'bizgoal',   abbr:'BG', color:'#c2700f', label:'Business Goal',sub:'Cut abandon 55%',cx:.78,cy:.15,size:52},
  {id:'journey',   abbr:'JO', color:'#2f5bea', label:'Journey',     sub:'Submit flow',   cx:.08, cy:.50, size:52},
  {id:'kpi',       abbr:'KP', color:'#4338ca', label:'KPI',         sub:'Completion Rate',cx:.85,cy:.50, size:52},
  {id:'components',abbr:'CO', color:'#2e8157', label:'Components',  sub:'24 linked',     cx:.20, cy:.82, size:52},
  {id:'experiment',abbr:'EX', color:'#ea580c', label:'Experiment',  sub:'A/B auto-suggest',cx:.50,cy:.83,size:52},
  {id:'decision',  abbr:'DE', color:'#7A6A5C', label:'Decision',    sub:'Severity merged',cx:.78,cy:.80,size:52},
];

const CENTER_NODE={abbr:'SCR', color:'#d4456b', size:80, cx:.50, cy:.50};

const AGENT_DETAILS={
  research:{title:'RESEARCH — Connected to this screen',body:'17 interviews · 89 support tickets · 3 usability sessions',signal:'"Priority vs Severity confusion" mentioned ×31',updated:'Scout last updated: 2 hours ago',color:'#1f9d8f'},
  persona:{title:'PERSONA — Devon Park, QA Engineer',body:'Primary persona for this screen. 3 direct feedback points on v2.',signal:'Top pain: "I never know what priority level to pick"',updated:'Synth last updated: 18 minutes ago',color:'#6f57d4'},
  bizgoal:{title:'BUSINESS GOAL — Reduce abandon rate',body:'Abandon rate from 55% → under 20%. Completion time < 60s.',signal:'This screen is the highest-abandon point in the funnel',updated:'Strategy last updated: June 20',color:'#c2700f'},
  journey:{title:'JOURNEY — Test Request Submit Flow',body:'6 steps total. This screen is step 2 of 6.',signal:'Steps 2–3 account for 78% of all abandons',updated:'UX last updated: 1 hour ago',color:'#2f5bea'},
  kpi:{title:'KPI — Completion Rate',body:'Target: 80%+ completion of step 2. Current baseline: 45%.',signal:'Auto-suggest on Priority field projected +22 pts',updated:'Metrics last updated: 3 hours ago',color:'#4338ca'},
  components:{title:'COMPONENTS — 24 Linked',body:'PriorityInput, SeveritySelect, FileAttach (optional), TextArea, StepNav.',signal:'PriorityInput has 3 open accessibility findings',updated:'QA last updated: 35 minutes ago',color:'#2e8157'},
  experiment:{title:'EXPERIMENT — Priority Auto-Suggest A/B',body:'Running: Control (manual entry) vs Treatment (auto-suggest from title).',signal:'Treatment shows 34% faster step completion in staging',updated:'Synth last updated: 20 minutes ago',color:'#ea580c'},
  decision:{title:'DECISION — Severity Merged into Priority',body:'Approved Jun 22. Severity field removed; Priority now 5-level with auto-suggest.',signal:'Reduced step 2 from 8 fields to 4. Devon + Sarah signed off.',updated:'Archived Jun 22',color:'#7A6A5C'},
};

const state={
  selectedNode:'research',
  activeTab:'design',
  sidebarSections:{screens:true},
  selectedSidebarItem:'Test Request Form',
  figmaReviewDone:false,
};

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  renderHeader();
  renderLeftSidebar();
  renderCenter();
  renderRightSidebar();

function renderCenter(){

  // SVG edges
  const cx_c=CENTER_NODE.cx*GW, cy_c=CENTER_NODE.cy*GH;
  let svgLines='';
  GRAPH_NODES.forEach(n=>{
    const nx=n.cx*GW, ny=n.cy*GH;
    const selected=state.selectedNode===n.id;
    svgLines+=`<line x1="${cx_c}" y1="${cy_c}" x2="${nx}" y2="${ny}" stroke="${n.color}" stroke-width="${selected?2:1.5}" stroke-opacity="${selected?.6:.25}"/>`;
  });

  // Peripheral nodes
  let nodesHtml='';
  GRAPH_NODES.forEach(n=>{
    const selected=state.selectedNode===n.id;
    nodesHtml+=`
      <div class="graph-node" style="left:${n.cx*100}%;top:${n.cy*100}%" onclick="selectNode('${n.id}')">
        <div class="circle" style="width:${n.size}px;height:${n.size}px;background:${n.color};font-size:11px;box-shadow:${selected?`0 0 0 3px #fff, 0 0 0 5px ${n.color}`:`0 2px 8px ${n.color}33`}">

  nodesHtml+=`

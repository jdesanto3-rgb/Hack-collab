<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="#0F0E0D"/>

  <!-- Warp: vertical threads in brand orange -->
  <rect x="4" y="2" width="8" height="28" fill="#D96000"/>
  <rect x="20" y="2" width="8" height="28" fill="#D96000"/>

  <!-- Weft: horizontal threads in white — over warp by default -->
  <rect x="2" y="4" width="28" height="8" fill="#FFFFFF"/>
  <rect x="2" y="20" width="28" height="8" fill="#FFFFFF"/>

  <!-- Plain-weave corrections: warp over weft at top-right and bottom-left -->
  <rect x="20" y="4"  width="8" height="8" fill="#D96000"/>
  <rect x="4"  y="20" width="8" height="8" fill="#D96000"/>
</svg>